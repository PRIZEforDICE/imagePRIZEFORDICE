function sectionTitle(s){return `<div class="section-title"><h2>${s}</h2></div>`}function eventHTML(e){return `<article class="schedule"><div class="day">${e[0]}<small>${e[1]}</small></div><div><h3>${e[3]}</h3><p><b>${tr('เวลา','Time')}:</b> ${e[2]}</p><p><b>${tr('สถานที่','Venue')}:</b> ${e[4]}</p><p><b>${tr('รายละเอียด / รับชม','Details / Watch')}:</b> ${e[5]}</p><p><b>${tr('ศิลปิน','Artist')}:</b> ${e[6]}</p></div></article>`}function photos(names){return `<div class="photo-grid">${names.map(n=>`<div class="photo"><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"></div>`).join('')}</div>`}function social(){return `<div class="socials"><a href="#contact">X — @prize_for_dice</a><a href="#contact">Instagram — @prize_for_dice</a><a href="#contact">TikTok — @prize_for_dice</a><a href="#contact">Facebook — PRIZE FOR DICE</a><a href="mailto:prizefordice@example.com">Email — prizefordice@example.com</a></div>`}function dieButton(n){return `<button class="die-button" id="rollDie" type="button" aria-label="${tr('ทอยลูกเต๋าเพื่อสุ่มเลข','Click to roll the dice')}">${dieSvg(n)}</button>`}
function home(){return `<section class="hero"><div><span class="eyebrow">🎲 ${tr('แฟนคลับ DICE','DICE fan community')}</span><h1>PRIZE<br>FOR DICE</h1><p class="lead">${tr('DICE คือการเดินทางที่เต็มไปด้วยความหลากหลายและการค้นพบ PRIZE อยู่ข้างๆ DICE เสมอ','DICE brings novelty, diverse dimensions, and a sense of discovery to every release and performance.')}</p><p><a class="btn" href="#news">${tr('ข่าวสาร','News')}</a><a class="btn alt" href="#schedule">${tr('ตารางงาน','Schedule')}</a></p><p style="color:var(--purple);font-weight:700;font-size:20px;margin-top:18px">DICE IS 10</p></div><div class="dice-stage">${dieButton(5)}<p class="roll-hint" id="rollHint">${tr('กดลูกเต๋าเพื่อทอย','Click the dice to roll')}</p></div></section><section class="section">${sectionTitle(tr('ข่าวสารล่าสุด','Latest news'))}<article class="card"><span class="tag">${tr('ผลงานใหม่','New release')}</span><span class="date">26 พ.ย. 2569</span><h3>DICERED feat. GALCHANIE – “สอนหน่อย (Teach Me)” OUT NOW!!</h3><p>MUSIC ON ALL STREAMING — เพลงใหม่จาก DICERED</p><a class="btn" href="https://dicesonray.lnk.to/TeachMe" target="_blank" rel="noopener noreferrer">${tr('ฟังเพลงเลย','Listen now')} ↗</a></article></section><section class="section">${sectionTitle(tr('ตารางงานที่กำลังจะมาถึง','Upcoming schedule'))}${events.slice(0,3).map(eventHTML).join('')}<a class="btn alt" href="#schedule">${tr('ดูตารางงานทั้งหมด','Full schedule')}</a></section><section class="section">${sectionTitle(tr('ผลงานและกิจกรรมล่าสุด','Latest works & activities'))}${photos(['DICEPURPLE','DICEBLUE','DICERED'])}</section><section class="section">${sectionTitle(tr('ติดตามพวกเรา','Follow us'))}${social()}</section>`}
const HISTORY_TH=`DICE บอยกรุ๊ปวงใหม่ สังกัด SONRAY MUSIC ในเครือ TADA Entertainment ส่วนที่มาของชื่อวง DICE หมายถึงลูกเต๋า เมื่อทอยแล้วพวกเขาจะเดินหน้าต่อไป สมาชิกทั้ง 10 คน ได้แก่ MIN (ธนกฤต ยิ่งวัฒนกุล), ALEX (Alexander Buckland), JAY (กัญจน์พล วิรุณณิธิพน), APO (วชิรกรณ์ รักษาสุวรรณ), JISANG (Akira Kim), OBO (อภิณัฐ เปี่ยมกุลวานิช), CHEESE (ชญาภพ เขียวอ่ำ), MADDOC (Maddoc Rhys Davies), OTTO (ศิภวิชญ์ พงษ์วชิริน), และ FRAME (ธนานนท์ สิทธิพานุกุล)\nชื่อแฟนคลับอย่างเป็นทางการของ DICE คือ PRIZE หมายถึงสิ่งล้ำค่าและเป็นรางวัล สะท้อนความสำคัญของแฟนๆ ที่มีต่อ DICE แฟนๆ คือรางวัลที่มีค่าของสมาชิก และ PRIZE จะอยู่เคียงข้างเป็นกำลังใจในทุกก้าวของ DICE\nวงมี 2 ยูนิต คือ DICEBLUE — ALEX, JAY, JISANG, OBO, CHEESE — และ DICERED — MIN, APO, MADDOC, OTTO, FRAME`;const HISTORY_EN=`DICE is a boy group under SONRAY MUSIC, part of TADA Entertainment. The group's name means “dice”: once rolled, they keep moving forward.\nThe 10 members are MIN (Thanakrit Yingwattanakul), ALEX (Alexander Buckland), JAY (Kansopon Wirunnithipon), APO (Watchirakorn Raksasuwan), JISANG (Akira Kim), OBO (Apinat Piamkulwanich), CHEESE (Chayaphon Khiao-iam), MADDOC (Maddoc Rhys Davies), OTTO (Sippawit Phongwacharin), and FRAME (Thanannat Sitthiphankul).\nDICE's official fandom name is PRIZE. It represents something precious and rewarding, reflecting the importance of fans to DICE. Fans are a treasured prize to the members, and PRIZE is always there as a reward and encouragement for every step DICE takes.\nThe group has two sub-units: DICEBLUE—ALEX, JAY, JISANG, OBO, and CHEESE—and DICERED—MIN, APO, MADDOC, OTTO, and FRAME.`;function historyContent(){return `<article class="card history-copy">${(lang==='th'?HISTORY_TH:HISTORY_EN).split('\n').map(p=>`<p>${p}</p>`).join('')}</article>`}function memberPage(){return `<h1>${tr('สมาชิก DICE','DICE Members')}</h1><p class="lead">${tr('10 คน 10 เสน่ห์ รวมอยู่ในชื่อเดียว','Ten members, ten charms, one name.')}</p><div class="member-grid">${members.map(m=>`<article class="card member-card"><img class="member-image" src="${ASSET}${m.en}.png" alt="${m.name} (${m.en})" loading="lazy"><h3>${m.name} (${m.en})</h3>${m.full?`<p class="muted">${m.full}</p>`:''}<div class="bio"><p><b>${tr('วันเกิด','Birthday')}:</b> ${m.born}</p><p><b>${tr('เข้าฝึก','Training')}:</b> ${m.train}</p><p><b>${tr('น้ำหนัก / ส่วนสูง','Weight / height')}:</b> ${m.weight} kg / ${m.height} cm</p><p><b>${tr('กรุ๊ปเลือด','Blood type')}:</b> ${m.blood} · <b>${tr('ราศี','Zodiac')}:</b> ${m.zodiac}</p><p><b>${tr('การศึกษา','Education')}:</b> ${m.edu}</p><p><b>X:</b> ${m.x} · <b>IG:</b> ${m.ig}</p></div></article>`).join('')}</div><p class="note">${tr('ข้อมูลอ้างอิง ณ 17 มีนาคม 2024 กรุณาตรวจสอบก่อนเผยแพร่','Information supplied, dated March 17, 2024. Please verify before publishing.')}</p>`}function aboutDice(){return `<h1>${tr('เกี่ยวกับ DICE','About DICE')}</h1>${photos(['DICEIS10-2024'])}${historyContent()}`}function aboutPrize(){return `<h1>${tr('เกี่ยวกับ PRIZE','About PRIZE')}</h1><p class="lead">${tr('PRIZE แบ่งปันข่าวสารและผลงานของ DICE เพื่อช่วยให้แฟนๆ ได้รู้จักวงมากขึ้น','PRIZE shares DICE news and works to help fans get to know the group.')}</p><article class="card"><h3>${tr('ขอบเขต','Scope')}</h3><p>${tr('เว็บไซต์นี้เป็นพื้นที่ประชาสัมพันธ์เท่านั้น ไม่รับบริจาคและไม่จัดกิจกรรมแฟนโปรเจกต์','This website is for publicity only. It accepts no donations and organizes no FAN PROJECT.')}</p></article>`}function musicPage(){return `<section class="music-hero"><h1>🎲 ${tr('เพลงของ DICE','DICE Music')}</h1><p>${tr('เลือกอัลบั้มเพื่อดูรายชื่อเพลงและลิงก์สตรีมมิง','Choose an album to browse its tracks and streaming links.')}</p></section><div class="album-grid">${albums.map(a=>`<a class="album-file" href="#album-${a.id}"><span class="album-symbol" aria-hidden="true">🎵</span><h2>${a.title}</h2><p>${a.tracks.length} ${tr('เพลง','tracks')} · ${tr('เปิดอัลบั้ม','Open album')} ↗</p></a>`).join('')}</div>`}function albumPage(id){const album=albums.find(a=>a.id===id);if(!album)return musicPage();return `<a class="back-link" href="#music">↩ ${tr('กลับไปหน้าเพลง','Back to music')}</a><div class="album-detail-head"><span class="album-symbol" aria-hidden="true">🎵</span><div><h1 style="font-size:clamp(27px,5vw,44px);margin:0">${album.title}</h1><span class="muted">${album.tracks.length} ${tr('เพลง','tracks')}</span></div></div><div class="track-list">${album.tracks.map((t,i)=>`<article class="track"><span class="track-number">${String(i+1).padStart(2,'0')}</span><div><h3>${t.title}</h3><p>${t.desc}</p></div><a class="btn" href="${t.url}" target="_blank" rel="noopener">${tr('ฟังเพลง','Stream')} ↗</a></article>`).join('')}</div>`}function schedule(){return `<h1>${tr('ตารางงาน','Schedule')}</h1><p class="lead">#DICESCHEDULE · ${tr('ตารางงาน DICE ประจำเดือนพฤศจิกายน 2569','DICE schedule — November 2026')}</p><p class="note">${tr('อัปเดตตามประกาศ โปรดติดตาม DICE','Updates will be announced. Please stay tuned and support DICE. 🎲')}</p><h2 style="margin-top:25px">${tr('พฤศจิกายน 2569','November 2026')}</h2>${events.map(eventHTML).join('')}<p class="note">${tr('โปรดตรวจสอบประกาศอย่างเป็นทางการ ตารางงานอาจเปลี่ยนแปลง','Please check official announcements; schedules may change.')}</p>`}function gallery(){return `<h1>${tr('แกลเลอรี','Gallery')}</h1><div class="gallery-empty">${tr('กำลังเตรียมรูปภาพและผลงานของ DICE','Gallery content is being prepared.')}</div>`}function newsPage(){return `<h1>${tr('ข่าวสาร','News')}</h1><article class="card"><span class="tag">${tr('ผลงานใหม่','New release')}</span><h2>DICERED feat. GALCHANIE — “สอนหน่อย (Teach Me)” OUT NOW!!</h2><p>MUSIC ON ALL STREAMING</p><a class="btn" href="https://dicesonray.lnk.to/TeachMe" target="_blank" rel="noopener noreferrer">${tr('ฟังเพลงเลย','Listen now')} ↗</a></article>`}function contact(){return `<h1>${tr('ติดต่อ','Contact')}</h1><p class="lead">${tr('ช่องทางโซเชียลและการติดต่อประชาสัมพันธ์','Social media and publicity contact')}</p>${social()}<p class="note">${tr('บัญชีโซเชียลและอีเมลเป็นข้อมูลตัวอย่าง กรุณาแทนที่ด้วยข้อมูลจริงก่อนเผยแพร่','Social accounts and email are placeholders; replace with real details before publishing.')}</p>`}
function view(route){if(route.startsWith('album-'))return albumPage(route.slice(6));switch(route){case'home':return home();case'members':return memberPage();case'history':return `<h1>${tr('ประวัติ DICE','DICE History')}</h1>${historyContent()}`;case'meaning':return `<h1>${tr('ความหมาย DICE & PRIZE','DICE & PRIZE Meaning')}</h1><article class="card"><h2>DICE — ${tr('การเติบโตและก้าวต่อไป','Growth and moving forward')}</h2><p>${tr('ลูกเต๋าที่ทอยแล้วเดินหน้าต่อไป สะท้อนสมาชิกทั้ง 10 คน','A dice keeps moving after it is rolled, reflecting all 10 members.')}</p></article>${photos(['DICENEW','DICEPART'])}<section class="unit blue"><h2>DICEBLUE</h2><p>${tr('ประกอบด้วย ALEX, JAY, JISANG, OBO และ CHEESE','DICEBLUE includes ALEX, JAY, JISANG, OBO, and CHEESE.')}</p>${photos(['DICEBLUE','DICEBLUEIDEA','DICEBLUEPART'])}</section><section class="unit red"><h2>DICERED</h2><p>${tr('ประกอบด้วย MIN, APO, MADDOC, OTTO และ FRAME','DICERED includes MIN, APO, MADDOC, OTTO, and FRAME.')}</p>${photos(['DICERED','DICEREDIDEA','DICEREDPART'])}</section><article class="card prize-meaning"><h2>PRIZE</h2><p>${tr('PRIZE หมายถึงสิ่งล้ำค่าและเป็นรางวัล สะท้อนความสำคัญของแฟนๆ ต่อ DICE','PRIZE means something precious and rewarding, reflecting fans’ importance to DICE.')}</p><h3 style="color:var(--purple)">#DICEforPRIZE</h3>${photos(['PRIZEWHITE'])}</article>`;case'schedule':return schedule();case'news':return newsPage();case'gallery':return gallery();case'music':return musicPage();case'about-dice':return aboutDice();case'about-prize':return aboutPrize();case'contact':return contact();default:return home()}}
const groups=[{title:'DICE FOR PRIZE',links:[['members','สมาชิก DICE','DICE Members'],['history','ประวัติ DICE','DICE History'],['meaning','ความหมาย DICE & PRIZE','DICE & PRIZE Meaning'],['schedule','ตารางงาน','Schedule'],['news','ข่าวสาร','News'],['gallery','แกลเลอรี','Gallery'],['music','เพลง DICE','DICE Music'],['contact','ติดต่อ','Contact']]},{title:'เกี่ยวกับเรา',links:[['about-dice','เกี่ยวกับ DICE','About DICE'],['about-prize','เกี่ยวกับ PRIZE','About PRIZE']]},{title:'EXTENSION',placeholder:'🔎 Realtime — อยู่ระหว่างเตรียมการ'}];function renderMenu(){document.getElementById('menuPanel').innerHTML=groups.map(g=>`<section class="group"><span class="group-title">${g.title}</span>${g.links?g.links.map(i=>`<a href="#${i[0]}">${tr(i[1],i[2])}</a>`).join(''):`<span class="menu-placeholder">${g.placeholder}</span>`}</section>`).join('')}
function bindDice(){const b=document.getElementById('rollDie');if(!b)return;b.addEventListener('click',()=>{const n=Math.floor(Math.random()*6)+1;b.classList.remove('roll');void b.offsetWidth;b.classList.add('roll');setTimeout(()=>{b.innerHTML=dieSvg(n);document.getElementById('rollHint').textContent=tr(`ทอยได้ ${n}`,`Rolled ${n}`);b.classList.remove('roll')},650)})}function showTransition(){const overlay=document.getElementById('introOverlay');overlay.classList.add('active');clearTimeout(introTimer);introTimer=setTimeout(()=>overlay.classList.remove('active'),1250)}function render(animate=false){const route=location.hash.slice(1)||'home';document.documentElement.lang=lang;document.getElementById('app').innerHTML=`<div class="page-enter">${view(route)}</div>`;document.getElementById('footer').innerHTML=`<p>PRIZEFORDICE.COM — ${tr('พื้นที่ประชาสัมพันธ์และแบ่งปันเรื่องราวของ DICE สำหรับแฟนๆ','A fan community for DICE news and information.')}</p><p>Copyright © 2026 prizefordice.com. All Rights Reserved.</p><p>${tr('เว็บไซต์นี้มีไว้เพื่อประชาสัมพันธ์ข่าวสารและช่วยให้แฟนๆ เรียนรู้เกี่ยวกับ DICE ไม่มีการรับบริจาคหรือจัดกิจกรรม FAN PROJECT','This website exists solely to publicize news and help fans learn more about DICE. No donations are accepted and no FAN PROJECT activities are organized. Thank you for your understanding.')}</p>`;document.querySelectorAll('.quick-top a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+route));document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false');bindDice();if(animate)showTransition()}
document.getElementById('menuButton').addEventListener('click',function(){const p=document.getElementById('menuPanel'),open=p.classList.toggle('open');this.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.getElementById('languageButton').addEventListener('click',()=>{lang=lang==='th'?'en':'th';render(false)});window.addEventListener('hashchange',()=>{render(true);window.scrollTo(0,0)});render(false);renderMenu();if(!sessionStorage.getItem('prizeIntroSeen')){sessionStorage.setItem('prizeIntroSeen','1');const overlay=document.getElementById('introOverlay');overlay.classList.add('active');introTimer=setTimeout(()=>overlay.classList.remove('active'),1750)}
</script>
