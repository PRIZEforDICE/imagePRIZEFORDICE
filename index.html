<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8ff"><meta name="description" content="PRIZE FOR DICE — fan community"><title>PRIZE FOR DICE</title>
<style>
:root{color-scheme:light;--bg:#faf8ff;--ink:#302448;--purple:#8054df;--lav:#ad90f3;--pink:#f5c2dc;--blue:#bce6f6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#faf8ff}.cover{position:fixed;inset:0;z-index:5;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 46%,#fff 0%,#faf8ff 48%,#f0eaff 100%);transition:opacity .85s ease,visibility .85s ease}.cover.leaving{opacity:0;visibility:hidden;pointer-events:none}.glow{position:absolute;width:min(78vw,650px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 15%,#f2eaffaa 54%,transparent 72%);animation:breathe 4s ease-in-out infinite}.cover-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}.brand{width:min(68vw,330px);height:120px;object-fit:contain;filter:drop-shadow(0 10px 24px #8054df32);opacity:0;transform:scale(.6);animation:brand-pop .8s cubic-bezier(.2,.8,.2,1) .8s forwards}.headline{margin:4px 0 8px;font-size:clamp(16px,3vw,21px);font-weight:600;letter-spacing:.14em;color:#65567d;opacity:0;animation:fade-up .55s ease 1.15s forwards}.tagline{margin:0 0 27px;color:#8b829a;font-size:14px;opacity:0;animation:fade-up .55s ease 1.3s forwards}.enter{position:relative;z-index:3;border:0;border-radius:999px;padding:14px 36px;background:linear-gradient(135deg,#9169ee,#7347d4);color:#fff;font-size:17px;font-weight:700;letter-spacing:.04em;box-shadow:0 10px 25px #8054df55,0 0 0 7px #8054df13;cursor:pointer;transition:transform .2s,box-shadow .2s;opacity:0;animation:fade-up .6s ease 1.45s forwards}.enter:hover,.enter:focus-visible{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 32px #8054df77,0 0 0 11px #8054df18}.enter:focus-visible{outline:3px solid #392568;outline-offset:6px}.gift{position:absolute;z-index:1;font-size:clamp(25px,6vw,46px);opacity:0;filter:drop-shadow(0 6px 8px #8054df33);animation:gift-burst 1.15s cubic-bezier(.15,.8,.25,1) .55s forwards}.gift.g1{--x:-190px;--y:-125px}.gift.g2{--x:190px;--y:-135px}.gift.g3{--x:-165px;--y:140px}.gift.g4{--x:168px;--y:142px}.dice-field{position:absolute;inset:0;z-index:1;pointer-events:none}.little-die{position:absolute;left:var(--x);top:var(--y);width:clamp(36px,6vw,58px);height:clamp(36px,6vw,58px);padding:7px;border:2px solid var(--die-color);border-radius:14px;background:#fff;box-shadow:3px 4px 0 var(--die-color),0 8px 18px #3c28631a;display:grid;place-items:center;animation:float var(--duration) ease-in-out var(--delay) infinite alternate;transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),transform .3s}.little-die svg{width:100%;height:100%;overflow:visible}.little-die circle{fill:var(--die-color)}.little-die.gather{animation:gather-wiggle .5s ease-in-out infinite alternate}.little-die.run{z-index:3}.hint{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:2;color:#8d829e;font-size:12px;white-space:nowrap;opacity:.8}.sparkle{position:absolute;z-index:1;font-size:18px;color:#a98bea;animation:twinkle 2.2s ease-in-out infinite alternate}.s1{left:18%;top:23%}.s2{left:79%;top:27%;animation-delay:.7s}.s3{left:16%;top:73%;animation-delay:1.2s}.s4{left:82%;top:70%;animation-delay:.3s}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes float{from{transform:translate3d(-9px,-7px,0) rotate(-13deg)}to{transform:translate3d(12px,10px,0) rotate(15deg)}}@keyframes gather-wiggle{from{transform:rotate(-9deg) scale(1)}to{transform:rotate(9deg) scale(1.08)}}@keyframes breathe{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.06);opacity:1}}@keyframes brand-pop{0%{opacity:0;transform:scale(.45) rotate(-8deg)}58%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes gift-burst{0%{opacity:0;transform:scale(.2) rotate(-30deg)}25%{opacity:1}100%{opacity:.9;transform:translate(var(--x),var(--y)) scale(1) rotate(18deg)}}@keyframes twinkle{from{opacity:.25;transform:scale(.7) rotate(-15deg)}to{opacity:1;transform:scale(1.2) rotate(20deg)}}@media(max-width:600px){.brand{height:94px}.headline{letter-spacing:.08em}.tagline{max-width:260px;line-height:1.6}.gift.g1{--x:-120px;--y:-105px}.gift.g2{--x:120px;--y:-112px}.gift.g3{--x:-112px;--y:130px}.gift.g4{--x:112px;--y:130px}.hint{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.brand,.headline,.tagline,.enter{opacity:1;transform:none}}
</style>
</head>
<body>
<iframe id="site" title="PRIZE FOR DICE website" src="https://cdn.jsdelivr.net/gh/PRIZEforDICE/imagePRIZEFORDICE@dcb44d2c5b4248bc5bbc5101bb0de23a8bcf23d4/index.html"></iframe>
<section class="cover" id="cover" aria-label="PRIZE FOR DICE — หน้าปกเว็บไซต์"><div class="glow" aria-hidden="true"></div><div class="dice-field" id="diceField" aria-hidden="true"></div><span class="sparkle s1" aria-hidden="true">✦</span><span class="sparkle s2" aria-hidden="true">✧</span><span class="sparkle s3" aria-hidden="true">✧</span><span class="sparkle s4" aria-hidden="true">✦</span><div class="cover-content"><img class="brand" src="https://cdn.jsdelivr.net/gh/PRIZEforDICE/imagePRIZEFORDICE@main/PRIZENEW.png" alt="PRIZE FOR DICE"><div class="headline">A LITTLE ROLL, A BIG SURPRISE</div><p class="tagline">ทอยลูกเต๋า แล้วออกเดินทางไปด้วยกัน 🎲</p><button class="enter" id="enterButton" type="button">เข้าสู่เว็บไซต์ <span aria-hidden="true">→</span></button></div><span class="gift g1" aria-hidden="true">🎁</span><span class="gift g2" aria-hidden="true">✨</span><span class="gift g3" aria-hidden="true">🎲</span><span class="gift g4" aria-hidden="true">🎁</span><div class="hint" id="hint">เอาเมาส์ชี้ลูกเต๋าให้วิ่งหนี แล้วลองเรียกมาที่ปุ่ม 🎲</div></section>
<script>
(()=>{'use strict';const field=document.getElementById('diceField'),button=document.getElementById('enterButton'),cover=document.getElementById('cover'),hint=document.getElementById('hint');const colors=['#8054df','#a88af0','#48a9e8','#f06479','#8a70d6'];const points=[[10,17],[26,31],[45,13],[68,23],[87,16],[13,61],[31,79],[53,69],[75,82],[91,57]];const dice=[];let gathering=false,entered=false;const faces=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]],spots=[[22,22],[50,22],[78,22],[22,50],[50,50],[78,50],[22,78],[50,78],[78,78]];
for(let i=0;i<10;i++){const el=document.createElement('span');el.className='little-die';el.dataset.index=i;el.style.setProperty('--x',points[i][0]+'%');el.style.setProperty('--y',points[i][1]+'%');el.style.setProperty('--die-color',colors[i%colors.length]);el.style.setProperty('--duration',(2.4+(i%4)*.45)+'s');el.style.setProperty('--delay',(-i*.37)+'s');const face=faces[(i%6)];el.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true">'+face.map(p=>'<circle cx="'+spots[p][0]+'" cy="'+spots[p][1]+'" r="9"/>').join('')+'</svg>';el.addEventListener('pointerenter',e=>{if(gathering||entered||e.pointerType==='touch')return;el.classList.add('run');const rect=cover.getBoundingClientRect(),r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=cx-e.clientX,dy=cy-e.clientY,len=Math.max(1,Math.hypot(dx,dy)),x=Math.max(2,Math.min(92,(r.left+dx/len*130)/rect.width*100)),y=Math.max(4,Math.min(86,(r.top+dy/len*105)/rect.height*100));el.style.setProperty('--x',x+'%');el.style.setProperty('--y',y+'%');setTimeout(()=>el.classList.remove('run'),430)});field.appendChild(el);dice.push(el)}
function gather(){if(entered)return;gathering=true;cover.classList.add('gathering');hint.textContent='ลูกเต๋าทั้ง 10 ก้อนมารวมตัวกันแล้ว! กดเพื่อเข้าสู่เว็บไซต์';const br=button.getBoundingClientRect(),cr=cover.getBoundingClientRect(),cx=(br.left+br.width/2-cr.left)/cr.width*100,cy=(br.top+br.height/2-cr.top)/cr.height*100;dice.forEach((d,i)=>{const a=(Math.PI*2*i/10)-Math.PI/2,r=62+(i%2)*18;d.classList.add('gather');d.style.setProperty('--x',Math.max(3,Math.min(94,cx+Math.cos(a)*r))+'%');d.style.setProperty('--y',Math.max(4,Math.min(88,cy+Math.sin(a)*r))+'%')})}function scatter(){if(entered)return;gathering=false;cover.classList.remove('gathering');hint.textContent='เอาเมาส์ชี้ลูกเต๋าให้วิ่งหนี แล้วลองเรียกมาที่ปุ่ม 🎲';dice.forEach((d,i)=>{d.classList.remove('gather');d.style.setProperty('--x',points[i][0]+'%');d.style.setProperty('--y',points[i][1]+'%')})}button.addEventListener('pointerenter',gather);button.addEventListener('focus',gather);button.addEventListener('pointerleave',scatter);button.addEventListener('blur',scatter);button.addEventListener('click',()=>{entered=true;cover.classList.add('leaving');setTimeout(()=>{cover.hidden=true;document.getElementById('site').focus?.()},900)});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&gathering)scatter()});
})();
</script>
</body>
</html>
