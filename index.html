const dateInfo=s=>{let d=new Date(s+"T12:00:00"),th=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],en=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return{day:d.getDate(),month:(lang==="th"?th:en)[d.getMonth()],year:lang==="th"?d.getFullYear()+543:d.getFullYear()}};const catName=(c,k)=>c[k]?(lang==="th"?c[k][0]:c[k][1]):k;const heading=(label,n=3)=>`<div class="section-title"><h2><span class="die-small" style="--dc:var(--purple)">${Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?"on":""}"></i>`).join("")}</span>${label}</h2></div>`;
function tabs(base,cats,current){return `<div class="tabs"><a class="${!current?"active":""}" href="#${base}">${tr("ทั้งหมด","All")}</a>${Object.keys(cats).map(k=>`<a class="${current===k?"active":""}" href="#${base}-${k}">${catName(cats,k)}</a>`).join("")}</div>`}function newsCard(n){let d=dateInfo(n.date);return `<article class="card"><span class="tag">${catName(newsCats,n.cat)}</span><span class="date">${d.day} ${d.month} ${d.year}</span><h3>${n.title}</h3><p>${n.summary}</p><a class="btn" href="${n.url}" target="_blank" rel="noopener noreferrer">${tr("ฟังเพลง","Listen now")} ↗</a></article>`}function eventCard(e){let d=dateInfo(e.d);return `<article class="schedule-card"><div class="schedule-date">${String(d.day).padStart(2,"0")}<small>${d.month}</small></div><div class="schedule-info"><h3>${e.title}</h3><p><strong>${tr("เวลา","Time")}:</strong> ${e.time}</p><p><strong>${tr("สถานที่","Venue")}:</strong> ${e.venue}</p><p><strong>${tr("รายละเอียด / ช่องทางรับชม","Details / Watch on")}:</strong> ${e.detail}</p><p><strong>${tr("ศิลปิน","Artist")}:</strong> ${e.artist}</p></div><span class="tag schedule-type">${catName(schedCats,e.cat)}</span></article>`}

function meaningPage(){return `<h1>${tr("ความหมาย DICE & PRIZE","The meaning of DICE & PRIZE")}</h1><article class="card"><h2>${tr("DICE — การเติบโตและก้าวต่อไป","DICE — growth and moving forward")}</h2><p>${tr("โลโก้ใหม่เป็นสัญลักษณ์ของการเติบโต ทั้งในด้านความสามารถและตัวตนที่ชัดเจนของสมาชิกทั้ง 10 คน การก้าวเข้าสู่บทใหม่ของ DICE เริ่มต้นด้วยการเผยโฉม Brand Identity และโลโก้ใหม่ ที่สะท้อนการเติบโตของวงทั้งด้านดนตรี Performance และอัตลักษณ์ที่ชัดเจนยิ่งขึ้นของสมาชิกทั้ง 10 คน ออกแบบโดย -iSM Branded Entertainment Agency ภายใต้แนวคิดที่หยิบยก “ลูกเต๋า” ซึ่งเป็นสัญลักษณ์ของชื่อวง มาเป็นแรงบันดาลใจหลัก","The new logo symbolizes the growth of all 10 members in their abilities and distinct identities. DICE's new Brand Identity, designed by -iSM Branded Entertainment Agency, takes inspiration from the dice in the group's name and reflects growth in music, performance, and identity.")}</p><p>${tr("โลโก้พัฒนาจากรูปทรงสามมิติ (3D) ของลูกเต๋า ก่อนคลี่ออกเป็น Grid System เพื่อสร้างตัวอักษร DICE ที่เรียบง่าย สมมาตร และร่วมสมัย ซ่อนรูปทรงลูกเต๋าไว้ใน Negative Space ของตัวอักษร “C” ขณะที่เส้นเฉียงของ “I” และ “E” ได้แรงบันดาลใจจากจังหวะการทอยลูกเต๋าที่พุ่งไปข้างหน้า สื่อถึงการเติบโต การพัฒนา และการก้าวไปข้างหน้าอย่างไม่หยุดนิ่ง","The logo transforms a 3D dice into a grid system to create a simple, symmetrical, contemporary DICE wordmark. A dice shape is hidden in the negative space of “C”; the diagonal strokes of “I” and “E” evoke a die moving forward, representing growth and continual progress.")}</p><p>${tr("สีม่วงเป็นสีประจำวง สื่อถึงการหลอมรวมระหว่าง Blue และ Red สองคาแรกเตอร์ที่แตกต่าง แนวคิดนี้ต่อยอดสู่ DICEBLUE และ DICERED แม้แต่ละยูนิตมีเอกลักษณ์เฉพาะตัว แต่ยังคงเป็นส่วนหนึ่งของ DICE","Purple is DICE's signature color and represents the blend of Blue and Red, two different characters. This idea extends into DICEBLUE and DICERED: distinct units that remain part of DICE.")}</p></article><div class="brand-grid">${["DICENEW","DICEPART","DICE"].map(n=>`<figure><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><figcaption>${n}</figcaption></figure>`).join("")}</div><video class="brand-video" controls preload="metadata" poster="${ASSET}DICE.png"><source src="${ASSET}DICE.mp4" type="video/mp4"></video><section class="unit-panel blue"><h2>DICEBLUE</h2><p>${tr("DICEBLUE ประกอบด้วย อเล็กซ์, เจย์, จีซัง, โอโบ และชีส ถ่ายทอดคาแรกเตอร์ที่สุขุมและยากจะคาดเดา ภายใต้ความสงบนิ่งเต็มไปด้วยอารมณ์ ความรู้สึก และเสน่ห์เฉพาะตัว เปรียบเสมือน Blue Flame เปลวไฟสีน้ำเงินที่ร้อนแรงแต่แฝงความนิ่งและน่าค้นหา","DICEBLUE features ALEX, JAY, JISANG, OBO, and CHEESE. Their composed, intriguing character is like a blue flame—intense yet calm, with a charm that unfolds over time.")}</p><p>${tr("โลโก้ได้รับแรงบันดาลใจจากรูปทรงและการเคลื่อนไหวของเปลวไฟ ใช้เส้นสายพลิ้วไหวผ่าน Distortion และ Grid System สื่อถึงความคมชัด แข็งแรง ทรงพลัง และเคลื่อนไหว","Its logo draws on the shape and flow of flames, using distortion and a grid system to express strength, clarity, power, and motion.")}</p><div class="brand-grid">${["DICEBLUE","DICEBLUEIDEA","DICEBLUEPART"].map(n=>`<figure><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><figcaption>${n}</figcaption></figure>`).join("")}</div></section><section class="unit-panel red"><h2>DICERED</h2><p>${tr("DICERED ประกอบด้วย มิน, อาโป, แมดดอค, อ๊อตโต้ และเฟรม ถ่ายทอดความมั่นใจ ความกล้า และพลังที่พร้อมแสดงออกอย่างเต็มที่ ได้แรงบันดาลใจจากจังหวะหัวใจที่พุ่งพล่านและพลังงาน Adrenaline","DICERED features MIN, APO, MADDOC, OTTO, and FRAME. The unit expresses confidence, courage, and energy inspired by a racing heartbeat and adrenaline.")}</p><p>${tr("แนวคิดโลโก้เริ่มจาก Heartbeat Pulse หรือเส้นชีพจร นำกราฟมอนิเตอร์วัดชีพจรมาปรับผ่าน Distortion ก่อนสร้าง Grid System จนเกิดเป็นโลโก้ที่เฉียบคม โดดเด่น และเต็มไปด้วยพลัง สื่อถึงการพร้อมพุ่งทะยานไปข้างหน้า","The logo begins with the Heartbeat Pulse. A monitor graph is distorted and developed into a grid system, creating a sharp, energetic identity ready to surge forward.")}</p><div class="brand-grid">${["DICERED","DICEREDIDEA","DICEREDPART"].map(n=>`<figure><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><figcaption>${n}</figcaption></figure>`).join("")}</div></section><article class="card" style="margin-top:24px"><h2>${tr("PRIZE — รางวัลและกำลังใจของ DICE","PRIZE — DICE's precious prize and support")}</h2><p>${tr("สื่อถึงสิ่งที่มีค่าและเป็นรางวัล สะท้อนถึงความสำคัญของแฟน ๆ ที่มีต่อวง DICE แฟนคลับก็เปรียบเสมือนรางวัลอันล้ำค่าของสมาชิกวง ทุกการก้าวเดินของ DICE ไม่ว่าจะก้าวเล็กหรือก้าวใหญ่จะมี PRIZE เป็นรางวัลและกำลังใจของ DICE เสมอ","PRIZE represents something precious and rewarding, reflecting how important fans are to DICE. Fans are a treasured prize to the members. With every step DICE takes, big or small, PRIZE will always be there as their reward and encouragement.")}</p><h3 style="color:var(--purple)">#DICEforPRIZE</h3><div class="brand-grid"><figure><img src="${ASSET}PRIZEWHITE.png" alt="PRIZE logo in white"><figcaption>PRIZE</figcaption></figure></div></article>`}
function memberPage(){return `<h1>${tr("สมาชิก DICE","DICE Members")}</h1><p class="lead">${tr("10 คน 10 เสน่ห์ รวมอยู่ในชื่อเดียว","Ten members, ten charms, together under one name.")}</p><div class="member-grid">${members.map(m=>`<article class="card member-card"><div class="member-photo-frame"><img class="member-photo" src="${ASSET}${m.en}.png" alt="${m.name} (${m.en})" loading="lazy"></div><h3>${m.name} <span class="muted">(${m.en})</span></h3>${m.full?`<p>${m.full}</p>`:""}<div class="bio"><p><b>${tr("เริ่มเทรนนิ่ง","Training since")}:</b> ${m.training}</p><p><b>${tr("วันเกิด","Birthday")}:</b> ${m.born}</p><p><b>${tr("น้ำหนัก / ส่วนสูง","Weight / Height")}:</b> ${m.weight} kg / ${m.height} cm</p><p><b>${tr("กรุ๊ปเลือด","Blood type")}:</b> ${m.blood} · <b>${tr("ราศี","Zodiac")}:</b> ${m.zodiac}</p><p><b>${tr("การศึกษา","Education")}:</b> ${m.education}</p><p><b>X:</b> ${m.x} · <b>IG:</b> ${m.ig}</p></div></article>`).join("")}</div><p class="note">${tr("ข้อมูลสมาชิกตามรายละเอียดที่ได้รับ ระบุข้อมูล ณ วันที่ 17 มีนาคม 2024 โปรดตรวจสอบความถูกต้องก่อนเผยแพร่","Member information provided, dated March 17, 2024. Please verify before publishing.")}</p>`}
function schedulePage(f){return `<h1>${tr("ตารางงาน","Schedule")}</h1><p class="lead">#DICESCHEDULE · ${tr("ตารางงาน DICE ประจำเดือนพฤศจิกายน 2569","DICE schedule for November 2026")}</p>${tabs("schedule",schedCats,f)}<p class="note">${tr("หากมีตารางงานเพิ่มเติมหรือมีอัปเดต จะแจ้งให้ทราบเพิ่มเติมอีกครั้ง ฝากทุกคนรอติดตามและเป็นกำลังใจให้ DICE กันเยอะ ๆ นะครับ 🎲✨","Additional dates or updates will be announced. Please stay tuned and keep supporting DICE. 🎲✨")}</p><div class="schedule-month">${tr("🎲 พฤศจิกายน 2569","🎲 November 2026")}</div>${events.filter(e=>!f||e.cat===f).map(eventCard).join("")}<p class="note">${tr("โปรดตรวจสอบเวลา สถานที่ และช่องทางรับชมจากประกาศทางการอีกครั้ง ตารางอาจมีการเปลี่ยนแปลง","Please confirm times, venues, and viewing channels through official announcements. Schedules may change.")}</p>`}
function galleryPage(f){let names=["DICEBLUE","DICERED","DICENEW","DICEPART","DICEBLUEIDEA","DICEREDIDEA","DICEBLUEPART","DICEREDPART"];return `<h1>${tr("คลังภาพและวิดีโอ","Gallery")}</h1><div class="grid">${names.map(n=>`<div class="tile"><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><b>${n}</b></div>`).join("")}<article class="card"><h3>DICE.mp4</h3><video class="brand-video" controls preload="metadata" poster="${ASSET}DICE.png"><source src="${ASSET}DICE.mp4" type="video/mp4"></video></article></div><p class="note">${tr("เผยแพร่ภาพและวิดีโอที่ได้รับอนุญาต พร้อมให้เครดิตเจ้าของผลงาน","Only authorized photos and videos are shared, with credit to their owners.")}</p>`}
function historyPage(){return `<h1>${tr("ประวัติ DICE","DICE History")}</h1><article class="card"><h3>${tr("เส้นทางของ DICE","DICE's journey")}</h3><p>${tr("เพิ่มเหตุการณ์สำคัญ ผลงาน และแหล่งอ้างอิงที่นี่","Add milestones, releases, and sources here.")}</p></article>`}
function view(hash){let key=hash;if(key==="home")return home();if(key==="news")return `<h1>${tr("ข่าวสาร","News")}</h1><div class="grid">${news.map(newsCard).join("")}</div>`;if(key==="schedule")return schedulePage("");if(key==="gallery")return galleryPage("");if(key==="about-dice")return aboutDice();if(key==="about-prize")return aboutPrize();if(key==="meaning")return meaningPage();if(key==="members")return memberPage();if(key==="history")return historyPage();if(key==="contact")return `<h1>${tr("ติดต่อเรา","Contact")}</h1><p class="lead">${tr("ติดตามข่าวสารทางโซเชียล หรือติดต่อเรื่องประชาสัมพันธ์","Follow us or contact us about publicity.")}</p>${socials()}<p class="note">${tr("บัญชีโซเชียลและอีเมลนี้ยังเป็นข้อมูลตัวอย่าง โปรดแทนที่ด้วยช่องทางจริงก่อนเผยแพร่","These social handles and email are placeholders. Replace them with real details before publishing.")}</p>`;return home()}
const menuGroups=[{title:"DICE FOR PRIZE",links:[["members","สมาชิก DICE","DICE Members"],["history","ประวัติ DICE","DICE History"],["meaning","ความหมาย DICE & PRIZE","DICE & PRIZE Meaning"],["schedule","ตารางงาน","Schedule"],["news","ข่าวสาร","News"],["gallery","คลังภาพ","Gallery"],["contact","ติดต่อเรา","Contact"]},{title:"ABOUT",links:[["about-dice","เกี่ยวกับ DICE","About DICE"],["about-prize","เกี่ยวกับ PRIZE","About PRIZE"]},{title:"EXTENSION",placeholder:["ยอดวิว Realtime","กำลังอยู่ในระหว่างการพัฒนา"]}];
function renderMenu(){document.getElementById("menuPanel").innerHTML=menuGroups.map(g=>`<section class="menu-group"><span class="menu-title">${g.title}</span>${g.links?g.links.map(([id,th,en])=>`<a href="#${id}">${tr(th,en)}</a>`).join(""):g.placeholder.map(x=>`<span class="menu-placeholder">${tr(x[0],"Realtime views")} · ${tr(x[1],"In development")}</span>`).join("")}</section>`).join("")}
function render(){let hash=location.hash.slice(1)||"home",dark=document.documentElement.dataset.theme==="dark";document.documentElement.lang=lang;document.getElementById("logo").innerHTML=`<img src="${ASSET}${dark?"PRIZEWHITE.png":"PRIZENEW.png"}" alt="PRIZE FOR DICE">`;document.getElementById("app").innerHTML=view(hash);document.getElementById("foot").textContent=tr("PRIZEFORDICE.COM — เป็นเว็บไซต์ที่จัดขึ้นเพื่อประชาสัมพันธ์ ข่าวสาร เพื่อให้แฟนคลับรู้จัก DICE มากขึ้นเท่านั้น ทางผู้พัฒนาขอชี้แจงว่าเว็บไซต์ไม่มีการรับบริจาคใด ๆ ทั้งสิ้น รวมถึงไม่มีการดำเนินการเกี่ยวกับ FAN PROJECT ขอบคุณสำหรับความเข้าใจ","PRIZEFORDICE.COM — This website is created solely to publicize news and help fans learn more about DICE. The developers clarify that the website does not accept donations or organize FAN PROJECT activities. Thank you for your understanding.");renderMenu();document.getElementById("menuPanel").classList.remove("open");document.getElementById("menuButton").setAttribute("aria-expanded","false");bindDice()}
function bindDice(){const d=document.getElementById("rollDie");if(!d)return;d.addEventListener("click",()=>{let n=1+Math.floor(Math.random()*6);d.classList.remove("roll");void d.offsetWidth;d.classList.add("roll");setTimeout(()=>{d.innerHTML=Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?"on":""}"></i>`).join("");document.getElementById("rollMessage").textContent=tr(`ออกแต้ม ${n} — ก้าวต่อไปด้วยกัน!`,`You rolled ${n} — keep moving forward!`);d.classList.remove("roll")},650)})}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});document.getElementById("menuButton").addEventListener("click",function(){let panel=document.getElementById("menuPanel"),open=panel.classList.toggle("open");this.setAttribute("aria-expanded",String(open))});document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap")){document.getElementById("menuPanel").classList.remove("open");document.getElementById("menuButton").setAttribute("aria-expanded","false")}});document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("menuPanel").classList.remove("open");document.getElementById("menuButton").setAttribute("aria-expanded","false")}});document.getElementById("lang").addEventListener("click",()=>{lang=lang==="th"?"en":"th";render()});document.getElementById("theme").addEventListener("click",()=>{let dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";document.getElementById("theme").textContent=dark?"☀":"☾";render()});render();
</script></body></html>
