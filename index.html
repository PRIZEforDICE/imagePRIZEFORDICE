function aboutDice(){return `<h1>${tr('เกี่ยวกับ DICE','About DICE')}</h1><p class="lead">${tr('การรวมตัวของสมาชิก 10 คนที่มีเสน่ห์และคาแรกเตอร์แตกต่างกัน ภายใต้อัตลักษณ์เดียว','Ten members with distinct charms and characters united under one identity.')}</p>${pictures(['DICENEW','DICE'])}<p class="note">${tr('ดูเรื่องราวและแนวคิดของ DICE เพิ่มเติมได้ที่ ความหมาย DICE & PRIZE','Discover more on the DICE & PRIZE meaning page.')}</p>`}
function aboutPrize(){return `<h1>${tr('เกี่ยวกับ PRIZE','About PRIZE')}</h1><p class="lead">${tr('PRIZE จัดทำเว็บไซต์เพื่อประชาสัมพันธ์ข่าวสารและผลงานของ DICE ให้แฟนคลับรู้จัก DICE มากขึ้น','PRIZE shares DICE news and works to help fans get to know the group.')}</p>${pictures(['PRIZENEW'])}<article class="card"><h3>${tr('ขอบเขตการดำเนินงาน','Scope')}</h3><p>${tr('เว็บไซต์นี้ประชาสัมพันธ์เท่านั้น ไม่มีการรับบริจาคหรือจัด FAN PROJECT','This website is for publicity only. It accepts no donations and organizes no FAN PROJECT.')}</p></article>`}
function meaning(){return `<h1>${tr('ความหมาย DICE & PRIZE','DICE & PRIZE Meaning')}</h1><article class="card"><h2>DICE — ${tr('การเติบโตและก้าวต่อไป','Growth and moving forward')}</h2><p>${tr('โลโก้ใหม่เป็นสัญลักษณ์ของการเติบโต ทั้งในด้านความสามารถและตัวตนที่ชัดเจนของสมาชิกทั้ง 10 คน Brand Identity และโลโก้ใหม่สะท้อนการเติบโตด้านดนตรี Performance และอัตลักษณ์ของสมาชิก ออกแบบโดย -iSM Branded Entertainment Agency โดยใช้ลูกเต๋าเป็นแรงบันดาลใจ','The new logo symbolizes the growth of all 10 members in their abilities and identities. The Brand Identity reflects growth in music, performance, and individual character. Designed by -iSM Branded Entertainment Agency, inspired by dice.')}</p><p>${tr('โลโก้พัฒนาจากรูปทรง 3D ของลูกเต๋า คลี่เป็น Grid System เพื่อสร้างตัวอักษร DICE ที่เรียบง่าย สมมาตร และร่วมสมัย ซ่อนรูปลูกเต๋าใน Negative Space ของ C ส่วนเส้นเฉียง I และ E สื่อถึงลูกเต๋าที่พุ่งไปข้างหน้า เป็นสัญลักษณ์ของการเติบโตและพัฒนา','The logo evolves a 3D die into a grid-based, simple, symmetrical, contemporary DICE wordmark. A die appears in the negative space of C; diagonal strokes in I and E suggest a die moving forward.')}</p><p>${tr('สีม่วงประจำวงสื่อถึงการหลอมรวม Blue และ Red สองคาแรกเตอร์ที่แตกต่าง นำไปสู่ DICEBLUE และ DICERED ซึ่งมีเอกลักษณ์ของตนแต่ยังเป็นส่วนหนึ่งของ DICE','Purple represents the blend of Blue and Red, two different characters extended into DICEBLUE and DICERED, distinct yet part of DICE.')}</p></article>${pictures(['DICENEW','DICEPART'])}<video class="video" controls preload="metadata" poster="${ASSET}DICE.png"><source src="${ASSET}DICE.mp4" type="video/mp4"></video><section class="unit blue"><h2>DICEBLUE</h2><p>${tr('DICEBLUE ได้แก่ อเล็กซ์ เจย์ จีซัง โอโบ และชีส ถ่ายทอดคาแรกเตอร์สุขุม ยากจะคาดเดา แต่มีอารมณ์และเสน่ห์ที่ค่อย ๆ เผยออกมา เปรียบเสมือน Blue Flame ที่ร้อนแรงแต่สงบนิ่ง โลโก้ได้แรงบันดาลใจจากรูปทรงและการเคลื่อนไหวของเปลวไฟ ถ่ายทอดด้วยเส้นพลิ้ว Distortion และ Grid System','DICEBLUE includes ALEX, JAY, JISANG, OBO, and CHEESE. Their composed, intriguing character is like a blue flame—intense yet calm. The logo draws on flame shapes and motion through fluid lines, distortion, and a grid system.')}</p>${pictures(['DICEBLUE','DICEBLUEIDEA','DICEBLUEPART'])}</section><section class="unit red"><h2>DICERED</h2><p>${tr('DICERED ได้แก่ มิน อาโป แมดดอค อ๊อตโต้ และเฟรม ถ่ายทอดความมั่นใจ ความกล้า และพลังจากจังหวะหัวใจและ Adrenaline แนวคิดโลโก้ Heartbeat Pulse พัฒนาจากกราฟชีพจร ผ่าน Distortion และ Grid System สื่อถึงพลังและการพุ่งไปข้างหน้า','DICERED includes MIN, APO, MADDOC, OTTO, and FRAME. The unit expresses confidence and energy inspired by heartbeat and adrenaline. Its Heartbeat Pulse logo transforms a pulse graph through distortion and a grid system to convey momentum.')}</p>${pictures(['DICERED','DICEREDIDEA','DICEREDPART'])}</section><article class="card"><h2>PRIZE</h2><p>${tr('สื่อถึงสิ่งที่มีค่าและเป็นรางวัล สะท้อนถึงความสำคัญของแฟน ๆ ที่มีต่อวง DICE แฟนคลับก็เปรียบเสมือนรางวัลอันล้ำค่าของสมาชิกวง ทุกการก้าวเดินของ DICE ไม่ว่าจะก้าวเล็กหรือก้าวใหญ่จะมี PRIZE เป็นรางวัลและกำลังใจของ DICE เสมอ','PRIZE represents something precious and rewarding, reflecting how important fans are to DICE. Fans are a treasured prize to the members. With every step DICE takes, big or small, PRIZE will always be its reward and encouragement.')}</p><h3 style="color:var(--purple)">#DICEforPRIZE</h3>${pictures(['PRIZEWHITE'])}</article>`}
function schedule(){return `<h1>${tr('ตารางงาน','Schedule')}</h1><p class="lead">#DICESCHEDULE · ${tr('ตารางงาน DICE ประจำเดือนพฤศจิกายน 2569','DICE schedule — November 2026')}</p><p class="note">${tr('หากมีตารางงานเพิ่มเติมหรือมีอัปเดต จะแจ้งให้ทราบอีกครั้ง ฝากติดตามและเป็นกำลังใจให้ DICE 🎲✨','Updates will be announced. Please stay tuned and support DICE. 🎲✨')}</p><h2 style="margin-top:25px">${tr('พฤศจิกายน 2569','November 2026')}</h2>${events.map(eventHTML).join('')}<p class="note">${tr('โปรดตรวจสอบเวลาและช่องทางรับชมจากประกาศทางการ ตารางอาจเปลี่ยนแปลง','Please check official announcements; schedules may change.')}</p>`}
function gallery(){return `<h1>${tr('คลังภาพและวิดีโอ','Gallery')}</h1>${pictures(assets)}<video class="video" controls preload="metadata" poster="${ASSET}DICE.png"><source src="${ASSET}DICE.mp4" type="video/mp4"></video><p class="note">${tr('เผยแพร่เฉพาะภาพและวิดีโอที่ได้รับอนุญาต พร้อมให้เครดิตเจ้าของผลงาน','Only authorized media is shared, with credit to owners.')}</p>`}
function newsPage(){return `<h1>${tr('ข่าวสาร','News')}</h1><article class="card"><span class="tag">${tr('ผลงานใหม่','New release')}</span><h2>DICERED feat. GALCHANIE ‘สอนที (Teach Me)’ OUT NOW!!</h2><p>MUSIC ON ALL STREAMING</p><p>ฟัง DICERED feat. GALCHANIE ‘สอนที (Teach Me)’ กันได้แล้วตอนนี้! 🏝️</p><a class="btn" href="https://dicesonray.lnk.to/TeachMe" target="_blank" rel="noopener">${tr('ฟังเพลง','Listen now')} ↗</a></article>`}
function contact(){return `<h1>${tr('ติดต่อเรา','Contact')}</h1><p class="lead">${tr('ช่องทางติดตามและติดต่อประชาสัมพันธ์','Social media and publicity contact')}</p>${social()}<p class="note">${tr('บัญชีและอีเมลเป็นข้อมูลตัวอย่าง กรุณาแทนที่ด้วยช่องทางจริงก่อนเผยแพร่','Social accounts and email are placeholders; replace with real details before publishing.')}</p>`}
function view(route){switch(route){case'home':return home();case'members':return memberPage();case'history':return `<h1>${tr('ประวัติ DICE','DICE History')}</h1><article class="card"><p>${tr('เพิ่มเหตุการณ์สำคัญและแหล่งอ้างอิงของ DICE ที่นี่','Add DICE milestones and sources here.')}</p></article>`;case'meaning':return meaning();case'schedule':return schedule();case'news':return newsPage();case'gallery':return gallery();case'about-dice':return aboutDice();case'about-prize':return aboutPrize();case'contact':return contact();default:return home()}}
const groups=[{title:'DICE FOR PRIZE',links:[['members','สมาชิก DICE','DICE Members'],['history','ประวัติ DICE','DICE History'],['meaning','ความหมาย DICE & PRIZE','DICE & PRIZE Meaning'],['schedule','ตารางงาน','Schedule'],['news','ข่าวสาร','News'],['gallery','คลังภาพ','Gallery'],['contact','ติดต่อเรา','Contact']]},{title:'เกี่ยวกับ',links:[['about-dice','เกี่ยวกับ DICE','About DICE'],['about-prize','เกี่ยวกับ PRIZE','About PRIZE']]},{title:'EXTENSION',placeholder:'ยอดวิว Realtime · อยู่ในระหว่างการพัฒนา'}];
function renderMenu(){const panel=document.getElementById('menuPanel');panel.innerHTML=groups.map(g=>`<section class="group"><span class="group-title">${g.title}</span>${g.links?g.links.map(item=>`<a href="#${item[0]}">${tr(item[1],item[2])}</a>`).join(''):`<span class="menu-placeholder">${g.placeholder}</span>`}</section>`).join('')}
function dieButton(n){return `<button class="die" id="rollDie" aria-label="${tr('กดเพื่อทอยลูกเต๋า','Click to roll the dice')}">${Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('')}</button>`}
function bindDice(){const button=document.getElementById('rollDie');if(!button)return;button.addEventListener('click',()=>{const n=Math.floor(Math.random()*6)+1;button.classList.remove('roll');void button.offsetWidth;button.classList.add('roll');setTimeout(()=>{button.innerHTML=Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('');document.getElementById('rollHint').textContent=tr(`ออกแต้ม ${n} — ก้าวต่อไปด้วยกัน!`,`You rolled ${n} — keep moving forward!`);button.classList.remove('roll')},650)})}
function render(){const route=location.hash.slice(1)||'home';document.documentElement.lang=lang;document.getElementById('app').innerHTML=view(route);document.getElementById('footer').textContent=tr('PRIZEFORDICE.COM — เป็นเว็บไซต์ที่จัดขึ้นเพื่อประชาสัมพันธ์ข่าวสาร เพื่อให้แฟนคลับรู้จัก DICE มากขึ้นเท่านั้น ทางผู้พัฒนาขอชี้แจงว่าเว็บไซต์ไม่มีการรับบริจาคใด ๆ ทั้งสิ้น รวมถึงไม่มีการดำเนินการเกี่ยวกับ FAN PROJECT ขอบคุณสำหรับความเข้าใจ','PRIZEFORDICE.COM — This website exists solely to publicize news and help fans learn more about DICE. The developers clarify that no donations are accepted and no FAN PROJECT activities are organized. Thank you for your understanding.');document.getElementById('siteLogo').src=ASSET+(document.documentElement.dataset.theme==='dark'?'PRIZEWHITE.png':'PRIZENEW.png');renderMenu();bindDice()}
document.getElementById('menuButton').addEventListener('click',function(){const panel=document.getElementById('menuPanel'),open=panel.classList.toggle('open');this.setAttribute('aria-expanded',String(open))});document.addEventListener('click',event=>{if(!event.target.closest('.menu-wrap')){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',event=>{if(event.key==='Escape'){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.getElementById('languageButton').addEventListener('click',()=>{lang=lang==='th'?'en':'th';render()});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script>
</body></html>
