function home(){return `<section class="hero"><div><span class="eyebrow">🎲 ${tr('แฟนคลับ DICE','DICE fan community')}</span><h1>PRIZE<br>FOR DICE</h1><p class="lead">${tr('DICE คือความแปลกใหม่ มิติที่หลากหลาย และความน่าค้นหาในแต่ละผลงานและโชว์','DICE brings novelty, diverse dimensions, and a sense of discovery to every release and performance.')}</p><a class="btn" href="#news">${tr('ข่าวสาร','News')}</a><a class="btn alt" href="#schedule">${tr('ตารางงาน','Schedule')}</a><p style="color:var(--purple);font-weight:700;font-size:20px;margin-top:18px">DICE IS 10</p><nav class="quick-menu" aria-label="Quick menu"><a class="btn" href="#news">${tr('ข่าวสาร','News')}</a><a class="btn" href="#schedule">${tr('ตารางงาน','Schedule')}</a><a class="btn" href="#members">${tr('สมาชิก DICE','DICE Members')}</a><a class="btn alt" href="#contact">${tr('ติดต่อเรา','Contact')}</a></nav></div><div class="dice-stage">${dieButton(5)}<p class="roll-hint" id="rollHint">${tr('กดลูกเต๋าเพื่อทอย','Click the dice to roll')}</p></div></section><section class="section">${title(tr('ข่าวสารล่าสุด','Latest news'))}<article class="card"><span class="tag">${tr('ผลงานใหม่','New release')}</span><span class="date">26 พ.ย. 2569</span><h3>DICERED feat. GALCHANIE ‘สอนที (Teach Me)’ OUT NOW!!</h3><p>MUSIC ON ALL STREAMING — ฟัง ‘สอนที (Teach Me)’ กันได้แล้วตอนนี้! 🏝️</p><a class="btn" href="https://dicesonray.lnk.to/TeachMe" target="_blank" rel="noopener noreferrer">${tr('ฟังเพลง','Listen now')} ↗</a></article></section><section class="section">${title(tr('ตารางงานที่กำลังจะมาถึง','Upcoming schedule'))}${events.slice(0,3).map(eventHTML).join('')}<a class="btn alt" href="#schedule">${tr('ดูตารางงานทั้งหมด','Full schedule')}</a></section><section class="section">${title(tr('ผลงานและกิจกรรมล่าสุด','Latest works & activities'))}${pictures(['DICEBLUE','DICERED','DICE'])}</section><section class="section">${title(tr('ติดตามเรา','Follow us'))}${socials()}</section>`}
const HISTORY_TH=`DICE บอยกรุ๊ปวงใหม่ สังกัด SONRAY MUSIC ในเครือ TADA Entertainment ส่วนที่มาของชื่อวง DICE นั้น มีความหมายตรงตัวว่า ลูกเต๋า ที่เปรียบพวกเขาเป็นลูกเต๋าที่ถูกทอยออกไปแล้วจะมีแต่ก้าวเดินออกไปข้างหน้า\nเหล่าสมาชิกวง DICE ทั้ง 10 คน นำทีมโดย มิน-ธนกฤต ยิ่งวัฒนกุล, อเล็กซ์-อเล็กซานเดอร์ บัคแลนด์, เจย์-กาญจน์โสภณ วิรุณนิธิพนธ์, อาโป-วชิรากร รักษาสุวรรณ, จีซัง-อคิรา คิม, โอโบ-อภิณัฏฐ์ เปี่ยมกุลวนิช, ชีส-ชยพล เขียวเอี่ยม, แมดดอค รีส์ เดวีส์, อ๊อตโต้-สิปปวิชญ์ พงษ์วชิรินทร์ และเฟรม-ธนันณัฐ สิทธิพันธุ์กุล ที่ได้ผ่านการฝึกซ้อมและสั่งสมประสบการณ์กันมาอย่างเต็มที่ พร้อมแล้วที่จะได้เดบิวต์ในนามของวง DICE ที่แฟน ๆ มากมายต่างรอคอย\nวง DICE มีชื่อแฟนคลับอย่างเป็นทางการคือ PRIZE (ไพร์ซ) สื่อถึงสิ่งที่มีค่าและเป็นรางวัล สะท้อนถึงความสำคัญของแฟน ๆ ที่มีต่อวง DICE แฟนคลับก็เปรียบเสมือนรางวัลอันล้ำค่าของสมาชิกวง ทุกการก้าวเดินของ DICE ไม่ว่าจะก้าวเล็กหรือก้าวใหญ่จะมี PRIZE เป็นรางวัลและกำลังใจของ DICE เสมอ\nยูนิตย่อยแบ่งออกเป็น 2 ยูนิต ได้แก่ DICEBLUE: อเล็กซ์, เจย์, จีซัง, โอโบ และชีส ส่วน DICERED: มิน, อาโป, แมดดอค, อ๊อตโต้ และเฟรม เพื่อก้าวเข้าสู่บทใหม่ของการทำงานและถ่ายทอดตัวตนของสมาชิกทั้ง 10 คนในมิติที่แตกต่างและชัดเจนยิ่งขึ้น.`;
const HISTORY_EN=`DICE is a boy group under SONRAY MUSIC, part of TADA Entertainment. The group's name means “dice”: once rolled, they keep moving forward.\nThe 10 members are MIN (Thanakrit Yingwattanakul), ALEX (Alexander Buckland), JAY (Kansopon Wirunnithipon), APO (Watchirakorn Raksasuwan), JISANG (Akira Kim), OBO (Apinat Piamkulwanich), CHEESE (Chayaphon Khiao-iam), MADDOC (Maddoc Rhys Davies), OTTO (Sippawit Phongwacharin), and FRAME (Thanannat Sitthiphankul). After extensive training and experience, they were ready to debut as the group fans had been waiting for.\nDICE's official fandom name is PRIZE. It represents something precious and rewarding, reflecting the importance of fans to DICE. Fans are a treasured prize to the members, and PRIZE is always there as a reward and encouragement for every step DICE takes, big or small.\nThe group has two sub-units: DICEBLUE—ALEX, JAY, JISANG, OBO, and CHEESE—and DICERED—MIN, APO, MADDOC, OTTO, and FRAME. The units present the 10 members in distinct dimensions as DICE enters a new chapter.`;
function historyContent(){const text=lang==='th'?HISTORY_TH:HISTORY_EN;return `<div class="card history-copy">${text.split('\n').map(p=>`<p>${p}</p>`).join('')}</div>`}
function memberPage(){return `<h1>${tr('สมาชิก DICE','DICE Members')}</h1><p class="lead">${tr('10 คน 10 เสน่ห์ รวมอยู่ในชื่อเดียว','Ten members, ten charms, one name.')}</p><div class="member-grid">${members.map(m=>`<article class="card member-card"><img class="member-image" src="${ASSET}${m.en}.png" alt="${m.name} (${m.en})" loading="lazy"><h3>${m.name} (${m.en})</h3>${m.full?`<p class="muted" style="text-align:center">${m.full}</p>`:''}<div class="bio"><p><b>${tr('เริ่มเทรนนิ่ง','Training')}:</b> ${m.train}</p><p><b>${tr('วันเกิด','Birthday')}:</b> ${m.born}</p><p><b>${tr('น้ำหนัก / ส่วนสูง','Weight / height')}:</b> ${m.weight} kg / ${m.height} cm</p><p><b>${tr('กรุ๊ปเลือด','Blood type')}:</b> ${m.blood} · <b>${tr('ราศี','Zodiac')}:</b> ${m.zodiac}</p><p><b>${tr('การศึกษา','Education')}:</b> ${m.edu}</p><p><b>X:</b> ${m.x} · <b>IG:</b> ${m.ig}</p></div></article>`).join('')}</div><p class="note">${tr('ข้อมูลตามรายละเอียดที่ได้รับ ณ วันที่ 17 มีนาคม 2024 โปรดตรวจสอบก่อนเผยแพร่','Information supplied, dated March 17, 2024. Please verify before publishing.')}</p>`}
function aboutDice(){return `<h1>${tr('เกี่ยวกับ DICE','About DICE')}</h1>${historyContent()}`}
function aboutPrize(){return `<h1>${tr('เกี่ยวกับ PRIZE','About PRIZE')}</h1><p class="lead">${tr('PRIZE จัดทำเว็บไซต์เพื่อประชาสัมพันธ์ข่าวสารและผลงานของ DICE ให้แฟนคลับรู้จัก DICE มากขึ้น','PRIZE shares DICE news and works to help fans get to know the group.')}</p><article class="card"><h3>${tr('ขอบเขตการดำเนินงาน','Scope')}</h3><p>${tr('เว็บไซต์นี้ประชาสัมพันธ์เท่านั้น ไม่มีการรับบริจาคหรือจัด FAN PROJECT','This website is for publicity only. It accepts no donations and organizes no FAN PROJECT.')}</p></article>`}
function meaning(){return `<h1>${tr('ความหมาย DICE & PRIZE','DICE & PRIZE Meaning')}</h1><article class="card"><h2>DICE — ${tr('การเติบโตและก้าวต่อไป','Growth and moving forward')}</h2><p>${tr('โลโก้ใหม่เป็นสัญลักษณ์ของการเติบโต ทั้งในด้านความสามารถและตัวตนที่ชัดเจนของสมาชิกทั้ง 10 คน Brand Identity และโลโก้ใหม่สะท้อนการเติบโตด้านดนตรี Performance และอัตลักษณ์ของสมาชิก ออกแบบโดย -iSM Branded Entertainment Agency โดยใช้ลูกเต๋าเป็นแรงบันดาลใจ','The new logo symbolizes the growth of all 10 members in their abilities and identities. The Brand Identity reflects growth in music, performance, and individual character. Designed by -iSM Branded Entertainment Agency, inspired by dice.')}</p><p>${tr('โลโก้พัฒนาจากรูปทรง 3D ของลูกเต๋า คลี่เป็น Grid System เพื่อสร้างตัวอักษร DICE ที่เรียบง่าย สมมาตร และร่วมสมัย ซ่อนรูปลูกเต๋าใน Negative Space ของ C ส่วนเส้นเฉียง I และ E สื่อถึงลูกเต๋าที่พุ่งไปข้างหน้า เป็นสัญลักษณ์ของการเติบโตและพัฒนา','The logo evolves a 3D die into a grid-based, simple, symmetrical, contemporary DICE wordmark. A die appears in the negative space of C; diagonal strokes in I and E suggest a die moving forward.')}</p><p>${tr('สีม่วงประจำวงสื่อถึงการหลอมรวม Blue และ Red สองคาแรกเตอร์ที่แตกต่าง นำไปสู่ DICEBLUE และ DICERED ซึ่งมีเอกลักษณ์ของตนแต่ยังเป็นส่วนหนึ่งของ DICE','Purple represents the blend of Blue and Red, two different characters extended into DICEBLUE and DICERED, distinct yet part of DICE.')}</p></article>${pictures(['DICENEW','DICEPART'])}<video class="video" controls preload="metadata" poster="${ASSET}DICE.png"><source src="${ASSET}DICE.mp4" type="video/mp4"></video><section class="unit blue"><h2>DICEBLUE</h2><p>${tr('DICEBLUE ได้แก่ อเล็กซ์ เจย์ จีซัง โอโบ และชีส ถ่ายทอดคาแรกเตอร์สุขุม ยากจะคาดเดา แต่มีอารมณ์และเสน่ห์ที่ค่อย ๆ เผยออกมา เปรียบเสมือน Blue Flame ที่ร้อนแรงแต่สงบนิ่ง โลโก้ได้แรงบันดาลใจจากรูปทรงและการเคลื่อนไหวของเปลวไฟ ถ่ายทอดด้วยเส้นพลิ้ว Distortion และ Grid System','DICEBLUE includes ALEX, JAY, JISANG, OBO, and CHEESE. Their composed, intriguing character is like a blue flame—intense yet calm. The logo draws on flame shapes and motion through fluid lines, distortion, and a grid system.')}</p>${pictures(['DICEBLUE','DICEBLUEIDEA','DICEBLUEPART'])}</section><section class="unit red"><h2>DICERED</h2><p>${tr('DICERED ได้แก่ มิน อาโป แมดดอค อ๊อตโต้ และเฟรม ถ่ายทอดความมั่นใจ ความกล้า และพลังจากจังหวะหัวใจและ Adrenaline แนวคิดโลโก้ Heartbeat Pulse พัฒนาจากกราฟชีพจร ผ่าน Distortion และ Grid System สื่อถึงพลังและการพุ่งไปข้างหน้า','DICERED includes MIN, APO, MADDOC, OTTO, and FRAME. The unit expresses confidence and energy inspired by heartbeat and adrenaline. Its Heartbeat Pulse logo transforms a pulse graph through distortion and a grid system to convey momentum.')}</p>${pictures(['DICERED','DICEREDIDEA','DICEREDPART'])}</section><article class="card prize-meaning"><h2>PRIZE</h2><p>${tr('สื่อถึงสิ่งที่มีค่าและเป็นรางวัล สะท้อนถึงความสำคัญของแฟน ๆ ที่มีต่อวง DICE แฟนคลับก็เปรียบเสมือนรางวัลอันล้ำค่าของสมาชิกวง ทุกการก้าวเดินของ DICE ไม่ว่าจะก้าวเล็กหรือก้าวใหญ่จะมี PRIZE เป็นรางวัลและกำลังใจของ DICE เสมอ','PRIZE represents something precious and rewarding, reflecting how important fans are to DICE. Fans are a treasured prize to the members. With every step DICE takes, big or small, PRIZE will always be its reward and encouragement.')}</p><h3 style="color:var(--purple)">#DICEforPRIZE</h3>${pictures(['PRIZEWHITE'])}</article>`}
function schedule(){return `<h1>${tr('ตารางงาน','Schedule')}</h1><p class="lead">#DICESCHEDULE · ${tr('ตารางงาน DICE ประจำเดือนพฤศจิกายน 2569','DICE schedule — November 2026')}</p><p class="note">${tr('หากมีตารางงานเพิ่มเติมหรือมีอัปเดต จะแจ้งให้ทราบอีกครั้ง ฝากติดตามและเป็นกำลังใจให้ DICE 🎲✨','Updates will be announced. Please stay tuned and support DICE. 🎲✨')}</p><h2 style="margin-top:25px">${tr('พฤศจิกายน 2569','November 2026')}</h2>${events.map(eventHTML).join('')}<p class="note">${tr('โปรดตรวจสอบเวลาและช่องทางรับชมจากประกาศทางการ ตารางอาจเปลี่ยนแปลง','Please check official announcements; schedules may change.')}</p>`}
function gallery(){return `<h1>${tr('คลังภาพและวิดีโอ','Gallery')}</h1><div class="gallery-empty">${tr('กำลังเตรียมคลังภาพและวิดีโอที่ได้รับอนุญาตให้เผยแพร่','Gallery content is being prepared.')}</div>`}
function newsPage(){return `<h1>${tr('ข่าวสาร','News')}</h1><article class="card"><span class="tag">${tr('ผลงานใหม่','New release')}</span><h2>DICERED feat. GALCHANIE ‘สอนที (Teach Me)’ OUT NOW!!</h2><p>MUSIC ON ALL STREAMING</p><p>ฟัง DICERED feat. GALCHANIE ‘สอนที (Teach Me)’ กันได้แล้วตอนนี้! 🏝️</p><a class="btn" href="https://dicesonray.lnk.to/TeachMe" target="_blank" rel="noopener noreferrer">${tr('ฟังเพลง','Listen now')} ↗</a></article>`}
function contact(){return `<h1>${tr('ติดต่อเรา','Contact')}</h1><p class="lead">${tr('ช่องทางติดตามและติดต่อประชาสัมพันธ์','Social media and publicity contact')}</p>${socials()}<p class="note">${tr('บัญชีและอีเมลเป็นข้อมูลตัวอย่าง กรุณาแทนที่ด้วยช่องทางจริงก่อนเผยแพร่','Social accounts and email are placeholders; replace with real details before publishing.')}</p>`}
function view(route){switch(route){case'home':return home();case'members':return memberPage();case'history':return `<h1>${tr('ประวัติวง DICE','DICE History')}</h1>${historyContent()}`;case'meaning':return meaning();case'schedule':return schedule();case'news':return newsPage();case'gallery':return gallery();case'about-dice':return aboutDice();case'about-prize':return aboutPrize();case'contact':return contact();default:return home()}}
const groups=[{title:'DICE FOR PRIZE',links:[['members','สมาชิก DICE','DICE Members'],['history','ประวัติ DICE','DICE History'],['meaning','ความหมาย DICE & PRIZE','DICE & PRIZE Meaning'],['schedule','ตารางงาน','Schedule'],['news','ข่าวสาร','News'],['gallery','คลังภาพ','Gallery'],['contact','ติดต่อเรา','Contact']]},{title:'เกี่ยวกับ',links:[['about-dice','เกี่ยวกับ DICE','About DICE'],['about-prize','เกี่ยวกับ PRIZE','About PRIZE']]},{title:'EXTENSION',placeholder:'ยอดวิว Realtime · อยู่ในระหว่างการพัฒนา'}];
function renderMenu(){document.getElementById('menuPanel').innerHTML=groups.map(g=>`<section class="group"><span class="group-title">${g.title}</span>${g.links?g.links.map(i=>`<a href="#${i[0]}">${tr(i[1],i[2])}</a>`).join(''):`<span class="menu-placeholder">${g.placeholder}</span>`}</section>`).join('')}
function bindDice(){const b=document.getElementById('rollDie');if(!b)return;b.addEventListener('click',()=>{const n=Math.floor(Math.random()*6)+1;b.classList.remove('roll');void b.offsetWidth;b.classList.add('roll');setTimeout(()=>{b.innerHTML=Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('');document.getElementById('rollHint').textContent=tr(`ออกแต้ม ${n} — ก้าวต่อไปด้วยกัน!`,`You rolled ${n} — keep moving forward!`);b.classList.remove('roll')},650)})}
function playLogoTransition(){const overlay=document.getElementById('introOverlay');overlay.classList.remove('page-transition');void overlay.offsetWidth;overlay.classList.add('active');clearTimeout(overlayTimer);overlayTimer=setTimeout(()=>overlay.classList.remove('active'),1900)}
function render(){const route=location.hash.slice(1)||'home';document.documentElement.lang=lang;document.getElementById('app').innerHTML=view(route);document.getElementById('footer').textContent=tr('PRIZEFORDICE.COM — เป็นเว็บไซต์ที่จัดขึ้นเพื่อประชาสัมพันธ์ข่าวสาร เพื่อให้แฟนคลับรู้จัก DICE มากขึ้นเท่านั้น ทางผู้พัฒนาขอชี้แจงว่าเว็บไซต์ไม่มีการรับบริจาคใด ๆ ทั้งสิ้น รวมถึงไม่มีการดำเนินการเกี่ยวกับ FAN PROJECT ขอบคุณสำหรับความเข้าใจ','PRIZEFORDICE.COM — This website exists solely to publicize news and help fans learn more about DICE. No donations are accepted and no FAN PROJECT activities are organized. Thank you for your understanding.');document.getElementById('siteLogo').src=ASSET+'PRIZENEW.png';document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false');bindDice()}
document.getElementById('menuButton').addEventListener('click',function(){const p=document.getElementById('menuPanel'),open=p.classList.toggle('open');this.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.getElementById('languageButton').addEventListener('click',()=>{lang=lang==='th'?'en':'th';render()});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);playLogoTransition()});renderMenu();render();playLogoTransition();
</script>
</body>
</html>
