function about(){return `<h1>${tr("เกี่ยวกับ PRIZE","About PRIZE")}</h1><p class="lead">${tr("บ้านเบสแฟนคลับ DICE เพื่อประชาสัมพันธ์เท่านั้น","A DICE fan base for publicity only.")}</p><div class="grid"><article class="card"><h3>${tr("ประวัติความเป็นมา","Our story")}</h3><p>${tr("PRIZE เกิดจากความรักและความตั้งใจที่จะรวบรวมข่าวสารและประชาสัมพันธ์ผลงานของ DICE (เพิ่มปีที่ก่อตั้งและเรื่องราวบ้านได้ที่นี่)","PRIZE was created to share news and publicize DICE's work. (Add the founding year and story here.)")}</p></article><article class="card"><h3>${tr("วัตถุประสงค์","Purpose")}</h3><p>${tr("เป็นพื้นที่ประชาสัมพันธ์ข่าวสาร ผลงาน และกิจกรรมของ DICE อย่างเป็นมิตร พร้อมระบุแหล่งที่มา","A friendly place to publicize DICE news, releases, and activities, with sources credited.")}</p></article><article class="card"><h3>${tr("วิสัยทัศน์และแนวทางการทำงาน","Vision & approach")}</h3><p>${tr("เผยแพร่ข้อมูลจากแหล่งที่เชื่อถือได้ ให้เครดิต และเคารพสมาชิกกับแฟน ๆ ทุกคน","Share reliable information, give credit, and respect all members and fans.")}</p></article><article class="card"><h3>${tr("ขอบเขตการดำเนินงาน","Scope")}</h3><p>${tr("PRIZE ทำเฉพาะงานประชาสัมพันธ์ ไม่มีการทำแฟนโปรเจ็กต์ และไม่รับเงินบริจาคทุกกรณี","PRIZE is for publicity only. We do not run fan projects or accept donations.")}</p></article></div>`}
function dicePage(){return `<h1>${tr("ความหมายของ DICE","The meaning of DICE")}</h1><p class="lead">${tr("โลโก้ใหม่เป็นสัญลักษณ์ของการเติบโต ทั้งในด้านความสามารถและตัวตนที่ชัดเจนของสมาชิกทั้ง 10 คน","The new logo represents the growth of all 10 members—in their abilities and distinct identities.")}</p><article class="card"><h2>${tr("บทใหม่ของ DICE","A new chapter for DICE")}</h2><p>${tr("การก้าวเข้าสู่บทใหม่ของ DICE เริ่มต้นด้วยการเผยโฉม Brand Identity และโลโก้ใหม่ ที่สะท้อนการเติบโตของวงทั้งด้านดนตรี Performance และอัตลักษณ์ที่ชัดเจนยิ่งขึ้นของสมาชิกทั้ง 10 คน ออกแบบโดย -iSM Branded Entertainment Agency โดยหยิบ “ลูกเต๋า” ซึ่งเป็นสัญลักษณ์ของชื่อวงมาเป็นแรงบันดาลใจหลัก","DICE entered a new chapter with a Brand Identity and logo reflecting growth in music, performance, and the distinct identities of all 10 members. Designed by -iSM Branded Entertainment Agency, the identity takes inspiration from the dice in the group's name.")}</p><p>${tr("โลโก้พัฒนาจากรูปทรงสามมิติ (3D) ของลูกเต๋า ก่อนคลี่ออกเป็น Grid System เพื่อสร้างตัวอักษร DICE ที่เรียบง่าย สมมาตร และร่วมสมัย ซ่อนรูปลูกเต๋าใน Negative Space ของตัว “C” ส่วนเส้นเฉียงของ “I” และ “E” ได้แรงบันดาลใจจากจังหวะทอยลูกเต๋าที่พุ่งไปข้างหน้า สื่อถึงการเติบโต การพัฒนา และการก้าวไปข้างหน้าอย่างไม่หยุดนิ่ง","The logo transforms a three-dimensional dice into a grid system to create a simple, symmetrical, contemporary DICE wordmark. A dice shape is hidden in the negative space of “C”; the diagonal strokes of “I” and “E” evoke a die moving forward, symbolizing growth and momentum.")}</p><p>${tr("สีม่วงเป็นสีประจำวง สื่อถึงการหลอมรวมระหว่าง Blue และ Red สองคาแรกเตอร์ที่แตกต่าง ซึ่งต่อยอดสู่ DICEBLUE และ DICERED โดยทั้งสองยูนิตยังคงเป็นส่วนหนึ่งของ DICE","Purple is DICE's signature color and represents the blend of Blue and Red—two different characters that extend into DICEBLUE and DICERED while remaining part of DICE.")}</p></article><div class="brand-grid">${["DICENEW","DICEPART","DICE"].map(n=>`<figure><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><figcaption>${n}</figcaption></figure>`).join("")}</div><video class="brand-video" controls preload="metadata" poster="${ASSET}DICE.png"><source src="${ASSET}DICE.mp4" type="video/mp4"></video><section class="unit-panel blue"><h2>DICEBLUE</h2><p>${tr("DICEBLUE ประกอบด้วยสมาชิก 5 คน ได้แก่ อเล็กซ์, เจย์, จีซัง, โอโบ และชีส ถ่ายทอดตัวตนผ่านคาแรกเตอร์ที่สุขุมและยากจะคาดเดา แต่ภายใต้ความนิ่งเต็มไปด้วยอารมณ์ ความรู้สึก และเสน่ห์เฉพาะตัว เปรียบเสมือน Blue Flame เปลวไฟสีน้ำเงินที่ร้อนแรงแต่แฝงความนิ่งและน่าค้นหา","DICEBLUE consists of ALEX, JAY, JISANG, OBO, and CHEESE. Their composed, hard-to-predict character holds emotion and distinctive charm beneath the surface—like a blue flame, intense yet calm and intriguing.")}</p><p>${tr("แนวคิดโลโก้ได้แรงบันดาลใจจากรูปทรงและการเคลื่อนไหวของเปลวไฟ ถ่ายทอดเส้นสายพลิ้วไหวผ่าน Distortion และ Grid System จนเกิดเป็นโลโก้ที่คมชัด แข็งแรง ทรงพลัง และแฝงความเคลื่อนไหว","Inspired by the shape and motion of flames, the logo uses fluid lines, distortion, and a grid system to create a sharp, strong, powerful identity with a sense of motion.")}</p><div class="brand-grid">${["DICEBLUE","DICEBLUEIDEA","DICEBLUEPART"].map(n=>`<figure><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><figcaption>${n}</figcaption></figure>`).join("")}</div></section><section class="unit-panel red"><h2>DICERED</h2><p>${tr("DICERED ประกอบด้วยสมาชิก 5 คน ได้แก่ มิน, อาโป, แมดดอค, อ๊อตโต้ และเฟรม ถ่ายทอดความมั่นใจ ความกล้า และพลังที่พร้อมแสดงออกอย่างเต็มที่ ได้แรงบันดาลใจจากจังหวะหัวใจที่พุ่งพล่านและพลังงาน Adrenaline","DICERED consists of MIN, APO, MADDOC, OTTO, and FRAME. The unit expresses confidence, courage, and energy, inspired by a racing heartbeat and adrenaline.")}</p><p>${tr("แนวคิดโลโก้เริ่มจาก Heartbeat Pulse หรือเส้นชีพจร นำกราฟมอนิเตอร์วัดชีพจรมาปรับองศาและเส้นสายผ่าน Distortion ก่อนพัฒนาเป็น Grid System จนเกิดเป็นโลโก้ที่เฉียบคม โดดเด่น และเต็มไปด้วยพลัง สื่อถึงการพร้อมพุ่งทะยานและก้าวไปข้างหน้า","The logo begins with the Heartbeat Pulse. A heart-monitor graph is distorted and developed into a grid system, producing a sharp, distinctive, energetic wordmark ready to surge forward.")}</p><div class="brand-grid">${["DICERED","DICEREDIDEA","DICEREDPART"].map(n=>`<figure><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><figcaption>${n}</figcaption></figure>`).join("")}</div></section>`}
function memberPage(){return `<h1>${tr("สมาชิก DICE","DICE Members")}</h1><p class="lead">${tr("10 คน 10 เสน่ห์ รวมอยู่ในชื่อเดียว","Ten members, ten charms, together under one name.")}</p><div class="member-grid">${members.map((m,i)=>`<article class="card member-card"><div class="member-photo-frame"><img class="member-photo" src="${ASSET}${m.en}.png" alt="${m.name} (${m.en})" loading="lazy"></div><h3>${m.name} <span class="muted">(${m.en})</span></h3>${m.full?`<p>${m.full}</p>`:""}<div class="bio"><p><b>${tr("เริ่มเทรนนิ่ง","Training since")}:</b> ${m.training}</p><p><b>${tr("วันเกิด","Birthday")}:</b> ${m.born}</p><p><b>${tr("น้ำหนัก / ส่วนสูง","Weight / Height")}:</b> ${m.weight} kg / ${m.height} cm</p><p><b>${tr("กรุ๊ปเลือด","Blood type")}:</b> ${m.blood} · <b>${tr("ราศี","Zodiac")}:</b> ${m.zodiac}</p><p><b>${tr("การศึกษา","Education")}:</b> ${m.education}</p><p><b>X:</b> ${m.x} · <b>IG:</b> ${m.ig}</p></div></article>`).join("")}</div><p class="note">${tr("ข้อมูลสมาชิกตามรายละเอียดที่ได้รับ ระบุข้อมูล ณ วันที่ 17 มีนาคม 2024 โปรดตรวจสอบความถูกต้องก่อนเผยแพร่","Member information provided, dated March 17, 2024. Please verify before publishing.")}</p>`}
function schedulePage(f){return `<h1>${tr("ตารางงาน","Schedule")}</h1><p class="lead">#DICESCHEDULE · ${tr("ตารางงาน DICE ประจำเดือนพฤศจิกายน 2569","DICE schedule for November 2026")}</p>${tabs("schedule",schedCats,f)}<p class="note">${tr("หากมีตารางงานเพิ่มเติมหรือมีอัปเดต จะแจ้งให้ทราบเพิ่มเติมอีกครั้ง ฝากทุกคนรอติดตามและเป็นกำลังใจให้ DICE กันเยอะ ๆ นะครับ 🎲✨","Additional dates or updates will be announced. Please stay tuned and keep supporting DICE. 🎲✨")}</p><div class="schedule-month">${die(2,COLORS[0],28)}${tr("พฤศจิกายน 2569","November 2026")}</div>${events.filter(e=>!f||e.cat===f).map(eventCard).join("")}<p class="note">${tr("โปรดตรวจสอบเวลา สถานที่ และช่องทางรับชมจากประกาศทางการอีกครั้ง ตารางอาจมีการเปลี่ยนแปลง","Please confirm times, venues, and viewing channels through official announcements. Schedules may change.")}</p>`}
function galleryPage(f){let names=["DICEBLUE","DICERED","DICENEW","DICEPART","DICEBLUEIDEA","DICEREDIDEA","DICEBLUEPART","DICEREDPART"];return `<h1>${tr("คลังภาพและวิดีโอ","Gallery")}</h1>${tabs("gallery",galleryCats,f)}<div class="grid">${names.map(n=>`<div class="tile"><img src="${ASSET}${n}.png" alt="${n}" loading="lazy"><b>${n}</b></div>`).join("")}<div class="card"><h3>DICE.mp4</h3><video class="brand-video" controls preload="metadata" poster="${ASSET}DICE.png"><source src="${ASSET}DICE.mp4" type="video/mp4"></video></div></div><p class="note">${tr("เผยแพร่ภาพและวิดีโอที่ได้รับอนุญาต พร้อมให้เครดิตเจ้าของผลงาน","Only authorized photos and videos are shared, with credit to their owners.")}</p>`}function historyPage(){return `<h1>${tr("ประวัติของ DICE","History of DICE")}</h1><div class="card"><h3>${tr("เส้นทางของ DICE","DICE's journey")}</h3><p>${tr("เพิ่มเหตุการณ์สำคัญ ผลงาน และแหล่งอ้างอิงที่นี่","Add milestones, releases, and sources here.")}</p></div>`}
function view(hash){let[key,f=""]=hash.split("-");if(key==="home")return home();if(key==="news")return `<h1>${tr("ข่าวสาร","News")}</h1>${tabs("news",newsCats,f)}<div class="grid">${news.filter(x=>!f||x.cat===f).map(newsCard).join("")}</div>`;if(key==="schedule")return schedulePage(f);if(key==="gallery")return galleryPage(f);if(key==="about")return about();if(["dice","diceblue","dicered"].includes(key))return dicePage();if(key==="members")return memberPage();if(key==="history")return historyPage();if(key==="contact")return `<h1>${tr("ติดต่อเรา","Contact")}</h1><p class="lead">${tr("ติดตามข่าวสารทางโซเชียล หรือติดต่อเรื่องประชาสัมพันธ์","Follow us or contact us about publicity.")}</p>${socials()}<p class="note">${tr("บัญชีโซเชียลและอีเมลนี้ยังเป็นข้อมูลตัวอย่าง โปรดแทนที่ด้วยช่องทางจริงก่อนเผยแพร่","These social handles and email are placeholders. Replace them with real contact details before publishing.")}</p>`;return home()}
const menuItems=[["home","หน้าแรก","Home"],["news","ข่าวสาร","News"],["schedule","ตารางงาน","Schedule"],["gallery","คลังภาพ","Gallery"],["about","เกี่ยวกับเรา","About Us"],["contact","ติดต่อเรา","Contact"]];function renderNav(hash){let current=hash.split("-")[0];document.getElementById("nav").innerHTML=menuItems.map(([id,th,en])=>{let active=id===current||id==="about"&&["dice","diceblue","dicered","members","history"].includes(current),drop="";if(id==="about")drop=`<div class="dropdown"><a href="#about">${tr("เกี่ยวกับบ้าน PRIZE","About PRIZE")}</a><small>${tr("เกี่ยวกับ DICE","About DICE")}</small><a href="#dice">${tr("ความหมายของ DICE","The meaning of DICE")}</a><a href="#diceblue">DICEBLUE</a><a href="#dicered">DICERED</a><a href="#members">${tr("สมาชิก DICE","DICE Members")}</a><a href="#history">${tr("ประวัติของ DICE","History of DICE")}</a></div>`;else if(["news","schedule","gallery"].includes(id)){let cats=id==="news"?newsCats:id==="schedule"?schedCats:galleryCats;drop=`<div class="dropdown"><a href="#${id}">${tr("ทั้งหมด","All")}</a>${Object.keys(cats).map(k=>`<a href="#${id}-${k}">${catName(cats,k)}</a>`).join("")}</div>`}return `<div class="nav-item"><a class="nav-link ${active?"active":""}" href="#${id}">${lang==="th"?th:en}</a>${drop}</div>`}).join("")}
function render(){let hash=location.hash.slice(1)||"home",dark=document.documentElement.dataset.theme==="dark";document.documentElement.lang=lang;document.getElementById("logo").innerHTML=`<img src="${ASSET}${dark?"PRIZEWHITE.png":"PRIZENEW.png"}" alt="PRIZE FOR DICE">`;document.getElementById("app").innerHTML=view(hash);document.getElementById("foot").textContent=tr("PRIZE FOR DICE — บ้านเบสแฟนคลับ DICE เพื่อประชาสัมพันธ์เท่านั้น ไม่มีแฟนโปรเจ็กต์และไม่รับเงินบริจาค · ไม่ใช่เว็บไซต์ทางการของ DICE","PRIZE FOR DICE — A DICE fan base for publicity only. No fan projects, no donations. Not an official DICE website.");document.getElementById("burger").textContent=tr("เมนู","Menu");renderNav(hash);document.getElementById("nav").classList.remove("open");document.getElementById("burger").setAttribute("aria-expanded","false")}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});document.getElementById("lang").addEventListener("click",()=>{lang=lang==="th"?"en":"th";render()});document.getElementById("burger").addEventListener("click",function(){let open=document.getElementById("nav").classList.toggle("open");this.setAttribute("aria-expanded",String(open))});document.getElementById("theme").addEventListener("click",()=>{let dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";document.getElementById("theme").textContent=dark?"☀":"☾";render()});render();
</script></body></html>
