const HISTORY_TH=`DICE บอยกรุ๊ปวงใหม่ สังกัด SONRAY MUSIC ในเครือ TADA Entertainment ส่วนที่มาของชื่อวง DICE นั้น มีความหมายตรงตัวว่า ลูกเต๋า ที่เปรียบพวกเขาเป็นลูกเต๋าที่ถูกทอยออกไปแล้วจะมีแต่ก้าวเดินออกไปข้างหน้า\nเหล่าสมาชิกวง DICE ทั้ง 10 คน นำทีมโดย มิน-ธนกฤต ยิ่งวัฒนกุล, อเล็กซ์-อเล็กซานเดอร์ บัคแลนด์, เจย์-กาญจน์โสภณ วิรุณนิธิพนธ์, อาโป-วชิรากร รักษาสุวรรณ, จีซัง-อคิรา คิม, โอโบ-อภิณัฏฐ์ เปี่ยมกุลวนิช, ชีส-ชยพล เขียวเอี่ยม, แมดดอค รีส์ เดวีส์, อ๊อตโต้-สิปปวิชญ์ พงษ์วชิรินทร์ และเฟรม-ธนันณัฐ สิทธิพันธุ์กุล ที่ได้ผ่านการฝึกซ้อมและสั่งสมประสบการณ์กันมาอย่างเต็มที่ พร้อมแล้วที่จะได้เดบิวต์ในนามของวง DICE ที่แฟน ๆ มากมายต่างรอคอย\nวง DICE มีชื่อแฟนคลับอย่างเป็นทางการคือ PRIZE (ไพร์ซ) สื่อถึงสิ่งที่มีค่าและเป็นรางวัล สะท้อนถึงความสำคัญของแฟน ๆ ที่มีต่อวง DICE แฟนคลับก็เปรียบเสมือนรางวัลอันล้ำค่าของสมาชิกวง ทุกการก้าวเดินของ DICE ไม่ว่าจะก้าวเล็กหรือก้าวใหญ่จะมี PRIZE เป็นรางวัลและกำลังใจของ DICE เสมอ\nยูนิตย่อยแบ่งออกเป็น 2 ยูนิต ได้แก่ DICEBLUE: อเล็กซ์, เจย์, จีซัง, โอโบ และชีส ส่วน DICERED: มิน, อาโป, แมดดอค, อ๊อตโต้ และเฟรม เพื่อก้าวเข้าสู่บทใหม่ของการทำงานและถ่ายทอดตัวตนของสมาชิกทั้ง 10 คนในมิติที่แตกต่างและชัดเจนยิ่งขึ้น.`;const HISTORY_EN=`DICE is a boy group under SONRAY MUSIC, part of TADA Entertainment. The group's name means “dice”: once rolled, they keep moving forward.\nThe 10 members are MIN (Thanakrit Yingwattanakul), ALEX (Alexander Buckland), JAY (Kansopon Wirunnithipon), APO (Watchirakorn Raksasuwan), JISANG (Akira Kim), OBO (Apinat Piamkulwanich), CHEESE (Chayaphon Khiao-iam), MADDOC (Maddoc Rhys Davies), OTTO (Sippawit Phongwacharin), and FRAME (Thanannat Sitthiphankul). After extensive training, they debuted as the group fans had been waiting for.\nDICE's official fandom name is PRIZE. It represents something precious and rewarding, reflecting the importance of fans to DICE. Fans are a treasured prize to the members, and PRIZE is always there as a reward and encouragement for every step DICE takes.\nThe group has two sub-units: DICEBLUE—ALEX, JAY, JISANG, OBO, and CHEESE—and DICERED—MIN, APO, MADDOC, OTTO, and FRAME.`;function historyContent(){return `<article class="card history-copy">${(lang==='th'?HISTORY_TH:HISTORY_EN).split('\n').map(p=>`<p>${p}</p>`).join('')}</article>`}

function musicPage(){const diceCoords=[[8,8,-40,70],[25,8,-80,70],[43,5,-30,65],[62,9,38,70],[80,8,90,70],[95,15,120,45],[8,43,-55,0],[22,76,-90,-50],[40,85,-35,-65],[58,84,38,-62],[76,78,90,-50],[94,56,60,5],[13,62,-55,15],[32,22,-40,45],[68,24,55,42],[84,42,95,0],[50,48,0,0]];const burst=diceCoords.map((p,i)=>`<span class="burst-die" style="--x:${p[0]}%;--y:${p[1]}%;--dx:${p[2]}px;--dy:${p[3]}px;--rot:${(i%2?1:-1)*30}deg;--c:${i%2?'#8054df':'#a88af0'};--delay:${i*.045}s"></span>`).join('');return `<section class="music-hero"><div class="dice-burst" aria-hidden="true">${burst}</div><h1>🎲 ${tr('เพลงของ DICE','DICE Music')}</h1><p>${tr('เลือกเพลง แล้วไปฟังบนแพลตฟอร์มสตรีมมิง','Choose a song and listen on your streaming platform.')}</p></section>${albums.map(album=>`<section class="music-album"><h2>${album.title}</h2><div class="track-list">${album.tracks.map((track,i)=>`<article class="track"><span class="track-number">${String(i+1).padStart(2,'0')}</span><div><h3>${track.title}</h3><p>${track.desc}</p></div><a class="btn" href="${track.url}" target="_blank" rel="noopener noreferrer">${tr('ฟังเพลง','Stream')} ↗</a></article>`).join('')}</div></section>`).join('')}`}
function schedule(){return `<h1>${tr('ตารางงาน','Schedule')}</h1><p class="lead">#DICESCHEDULE · ${tr('ตารางงาน DICE ประจำเดือนพฤศจิกายน 2569','DICE schedule — November 2026')}</p><p class="note">${tr('หากมีตารางงานเพิ่มเติมหรือมีอัปเดต จะแจ้งให้ทราบอีกครั้ง ฝากติดตามและเป็นกำลังใจให้ DICE 🎲✨','Updates will be announced. Please stay tuned and support DICE. 🎲✨')}</p><h2 style="margin-top:25px">${tr('พฤศจิกายน 2569','November 2026')}</h2>${events.map(eventHTML).join('')}<p class="note">${tr('โปรดตรวจสอบเวลาและช่องทางรับชมจากประกาศทางการ ตารางอ���จเปลี่ยนแปลง','Please check official announcements; schedules may change.')}</p>`}function gallery(){return `<h1>${tr('คลังภาพและวิดีโอ','Gallery')}</h1><div class="gallery-empty">${tr('กำลังเตรียมคลังภาพและวิดีโอที่ได้รับอนุญาตให้เผยแพร่','Gallery content is being prepared.')}</div>`}function newsPage(){return `<h1>${tr('ข่าวสาร','News')}</h1><article class="card"><span class="tag">${tr('ผลงานใหม่','New release')}</span><h2>DICERED feat. GALCHANIE ‘สอนที (Teach Me)’ OUT NOW!!</h2><p>MUSIC ON ALL STREAMING</p><p>ฟัง DICERED feat. GALCHANIE ‘สอนที (Teach Me)’ กันได้แล้วตอนนี้! 🏝️</p><a class="btn" href="https://dicesonray.lnk.to/TeachMe" target="_blank" rel="noopener noreferrer">${tr('ฟังเพลง','Listen now')} ↗</a></article>`}function contact(){return `<h1>${tr('ติดต่อเรา','Contact')}</h1><p class="lead">${tr('ช่องทางติดตามและติดต่อประชาสัมพันธ์','Social media and publicity contact')}</p>${social()}<p class="note">${tr('บัญชีและอีเมลเป็นข้อมูลตัวอย่าง กรุณาแทนที่ด้วยช่องทางจริงก่อนเผยแพร่','Social accounts and email are placeholders; replace with real details before publishing.')}</p>`}
function view(route){switch(route){case'home':return home();case'members':return memberPage();case'history':return `<h1>${tr('ประวัติวง DICE','DICE History')}</h1>${historyContent()}`;case'meaning':return `<h1>${tr('ความหมาย DICE & PRIZE','DICE & PRIZE Meaning')}</h1><article class="card"><h2>DICE — ${tr('การเติบโตและก้าวต่อไป','Growth and moving forward')}</h2><p>${tr('โลโก้ใหม่เป็นสัญลักษณ์ของการเติบโต ทั้งในด้านความสามารถและตัวตนที่ชัดเจนของสมาชิกทั้ง 10 คน ออกแบ���โดย -iSM Branded Entertainment Agency โดยใช้ลูกเต๋าเป็นแรงบันดาลใจ โลโก้คลี่จากรูปทรง 3D เป็น Grid System ซ่อนลูกเต๋าใน Negative Space ของ C และเส้นเฉียง I, E สื่อถึงการทอยไปข้างหน้า สีม่วงสื่อถึง Blue และ Red ที่หลอมรวมเป็น DICEBLUE และ DICERED','The new identity, designed by -iSM Branded Entertainment Agency, uses dice to represent the growth of all 10 members. Its 3D form unfolds into a grid; the negative space in C hides a die, while I and E suggest forward motion. Purple blends the Blue and Red identities into DICEBLUE and DICERED.')}</p></article>${photos(['DICENEW','DICEPART'])}<section class="unit blue"><h2>DICEBLUE</h2><p>${tr('DICEBLUE ได้แก่ อเล็กซ์ เจย์ จีซัง โอโบ และชีส ถ่ายทอดคาแรกเตอร์สุขุมและน่าค้นหา เปรียบเสมือน Blue Flame ที่ร้อนแรงแต่สงบนิ่ง โลโก้ได้แรงบันดาลใจจากรูปทรงและการเคลื่อนไหวของเปลวไฟ','DICEBLUE includes ALEX, JAY, JISANG, OBO, and CHEESE. Their composed, intriguing character is like a blue flame. Its logo is inspired by the shape and movement of flames.')}</p>${photos(['DICEBLUE','DICEBLUEIDEA','DICEBLUEPART'])}</section><section class="unit red"><h2>DICERED</h2><p>${tr('DICERED ได้แก่ มิน อาโป แมดดอค อ๊อตโต้ และเฟรม ถ่ายทอดความมั่นใจและพลังจากจังหวะหัวใจและ Adrenaline แนวคิด Heartbeat Pulse สื่อถึงความกล้าและการพุ่งไปข้างหน้า','DICERED includes MIN, APO, MADDOC, OTTO, and FRAME. Inspired by heartbeat and adrenaline, the unit expresses confidence, courage, and forward energy.')}</p>${photos(['DICERED','DICEREDIDEA','DICEREDPART'])}</section><article class="card prize-meaning"><h2>PRIZE</h2><p>${tr('สื่อถึงสิ่งที่มีค่าและเป็นรางวัล สะท้อนถึงความสำคัญของแฟน ๆ ที่มีต่อวง DICE แฟนคลับก็เปรียบเสมือนรางวัลอันล้ำค่าของสมาชิกวง ทุกการก้าวเดินของ DICE ไม่ว่าจะก้าวเล็กหรือก้าวใหญ่จะมี PRIZE เป็นรางวัลและกำลังใจของ DICE เสมอ','PRIZE means something precious and rewarding, reflecting fans’ importance to DICE. Fans are a treasured prize to the members, and PRIZE is always their reward and encouragement with every step.')}</p><h3 style="color:var(--purple)">#DICEforPRIZE</h3>${photos(['PRIZEWHITE'])}</article>`;case'schedule':return schedule();case'news':return newsPage();case'gallery':return gallery();case'music':return musicPage();case'about-dice':return aboutDice();case'about-prize':return aboutPrize();case'contact':return contact();default:return home()}}
const groups=[{title:'DICE FOR PRIZE',links:[['members','สมาชิก DICE','DICE Members'],['history','ประวัติ DICE','DICE History'],['meaning','ความหมาย DICE & PRIZE','DICE & PRIZE Meaning'],['schedule','ตารางงาน','Schedule'],['news','ข่าวสาร','News'],['gallery','คลังภาพ','Gallery'],['music','เพลง','Music'],['contact','ติดต่อเรา','Contact']]},{title:'เกี่ยวกับ',links:[['about-dice','เกี่ยวกับ DICE','About DICE'],['about-prize','เกี่ยวกับ PRIZE','About PRIZE']]},{title:'EXTENSION',placeholder:'ยอดวิว Realtime · อยู่ในระหว่างการพัฒนา'}];function renderMenu(){document.getElementById('menuPanel').innerHTML=groups.map(g=>`<section class="group"><span class="group-title">${g.title}</span>${g.links?g.links.map(i=>`<a href="#${i[0]}">${tr(i[1],i[2])}</a>`).join(''):`<span class="menu-placeholder">${g.placeholder}</span>`}</section>`).join('')}
function bindDice(){const b=document.getElementById('rollDie');if(!b)return;b.addEventListener('click',()=>{const n=Math.floor(Math.random()*6)+1;b.classList.remove('roll');void b.offsetWidth;b.classList.add('roll');setTimeout(()=>{b.innerHTML=Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('');document.getElementById('rollHint').textContent=tr(`ออกแต้ม ${n} — ก้าวต่อไปด้วยกัน!`,`You rolled ${n} — keep moving forward!`);b.classList.remove('roll')},650)})}
function showTransition(){const overlay=document.getElementById('introOverlay');overlay.classList.add('active','transition');clearTimeout(introTimer);introTimer=setTimeout(()=>overlay.classList.remove('active','transition'),1250)}function render(animate=false){const route=location.hash.slice(1)||'home';document.documentElement.lang=lang;document.getElementById('app').innerHTML=`<div class="page-enter">${view(route)}</div>`;document.getElementById('footer').innerHTML=`<p>PRIZEFORDICE.COM — ${tr('เป็นเว็บไซต์ที่จัดขึ้นเพื่อประชาสัมพันธ์ข่าวสาร เพื่อให้แฟนคลับรู้จัก DICE มากขึ้นเท่านั้น ทางผู้พัฒนาขอชี้แจงว่าเว็บไซต์ไม่มีการรับบริจาคใด ๆ ทั้งสิ้น รวมถึงไม่มีการดำเนินการเกี่ยวกับ FAN PROJECT ขอบคุณสำหรับความเข้าใจ','This website exists solely to publicize news and help fans learn more about DICE. No donations are accepted and no FAN PROJECT activities are organized. Thank you for your understanding.')}</p><p>Copyright © 2026 prizefordice.com. All Rights Reserved.</p>`;document.querySelectorAll('.quick-top a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+route));document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false');bindDice();if(animate)showTransition()}
document.getElementById('menuButton').addEventListener('click',function(){const p=document.getElementById('menuPanel'),open=p.classList.toggle('open');this.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('menuPanel').classList.remove('open');document.getElementById('menuButton').setAttribute('aria-expanded','false')}});document.getElementById('languageButton').addEventListener('click',()=>{lang=lang==='th'?'en':'th';render(false)});window.addEventListener('hashchange',()=>{render(true);window.scrollTo(0,0)});render(false);renderMenu();if(!sessionStorage.getItem('prizeIntroSeen')){sessionStorage.setItem('prizeIntroSeen','1');const overlay=document.getElementById('introOverlay');overlay.classList.add('active');introTimer=setTimeout(()=>overlay.classList.remove('active'),1750)}
</script>
</body>
